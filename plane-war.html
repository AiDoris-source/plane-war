<!DOCTYPE html>

<style>
  /* ========== 全局重置 ========== */

<script>
/**
 * ============================================================
 *  星际歼击 - 飞机大战 V3.7  |  Star Strike - Plane War V3.7
 *  纯原生 JS + Canvas 实现，无外部依赖
 *  V3.7：变形动画移至答题后+3秒专属展示+音效修复
 * ============================================================
 */

// ==================== 工具函数 ====================

/** 生成 [min, max) 范围随机数 */
function rand(min, max) {
  return Math.random() * (max - min) + min;
}

/** 生成 [min, max] 范围随机整数 */
function randInt(min, max) {
  return Math.floor(rand(min, max + 1));
}

/** 两点距离 */
function dist(x1, y1, x2, y2) {
  const dx = x1 - x2, dy = y1 - y2;
  return Math.sqrt(dx * dx + dy * dy);
}

/** 矩形碰撞检测 */
function rectCollide(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

/** 线性插值 */
function lerp(a, b, t) {
  return a + (b - a) * t;
}

/** 限制值在 [lo, hi] */
function clamp(v, lo, hi) {
  return v < lo ? lo : v > hi ? hi : v;
}

/** HSL 转字符串 */
function hsl(h, s, l, a) {
  return a !== undefined
    ? `hsla(${h},${s}%,${l}%,${a})`
    : `hsl(${h},${s}%,${l}%)`;
}

// ==================== 音效管理器（Web Audio API） ====================

class AudioManager {
  constructor() {
    this.ctx = null;
    this.muted = false;
    this.initialized = false;
    this.shootLastTime = 0;
    this.shootThrottle = 100;
    this.cachedVoices = [];
    // V4.2: 34种庆祝语音（中英混合 + 本地高质量edge-tts音频）
    this.celebrationMessages = [
      '周泽森，你真棒！继续加油！', '周泽森，太牛了！无人能挡！', '周泽森，你就是天才！',
      '戴周翰，宇宙最强！所向披靡！', '戴周翰出击，敌人全部逃跑！', '戴周翰大魔王驾到！颤抖吧！', '戴周翰来了，全屏清空！无敌！',
      '戴雨晗，神机妙算！太厉害了！', '戴雨晗出马，一个顶俩！', '戴雨晗闪亮登场！全场欢呼！', '戴雨晗无敌美少女战士！',
      '太酷啦！雷霆出击！火力全开！', '完美通关！你是无敌战神！', '哇！太厉害了！再来一次！', '王牌飞行员！星际霸主！势不可挡！',
      'Unstoppable! You are the champion!', 'No one can stop you! Legendary!', 'Absolute domination! Godlike!', 'Mission accomplished, hero! You rock!', 'Too easy! Too strong! Amazing!',
      '嘿嘿，这波操作太骚了！', '厉害厉害，五体投地！', '太强了吧！敌人已经吓跑了！', '绝杀！完美收官！再来一局！',
      // V4.2 新增（10条）
      '戴周翰，牛到讲方言！', '戴雨晗，猴赛雷！', 'Come on！一起加油！', '再接再厉，勇往直前！',
      '哎呀，战机没油了！', '火箭弹来啦！', '霹雳战车解锁！', '周泽森，来个空翻炸弹！',
      '雷霆战机激活！满屏战机闪烁！', '一起加油！我们是最强的！',
    ];
    // 庆祝音频文件（与上面文字一一对应，edge-tts生成）
    this.celebrationAudioFiles = [
      'audio/01_zesen_1.mp3', 'audio/02_zesen_2.mp3', 'audio/03_zesen_3.mp3',
      'audio/04_zhouhan_1.mp3', 'audio/05_zhouhan_2.mp3', 'audio/06_zhouhan_3.mp3', 'audio/07_zhouhan_4.mp3',
      'audio/08_yuhan_1.mp3', 'audio/09_yuhan_2.mp3', 'audio/10_yuhan_3.mp3', 'audio/11_yuhan_4.mp3',
      'audio/12_generic_1.mp3', 'audio/13_generic_2.mp3', 'audio/14_generic_3.mp3', 'audio/15_generic_4.mp3',
      'audio/16_english_1.mp3', 'audio/17_english_2.mp3', 'audio/18_english_3.mp3', 'audio/19_english_4.mp3', 'audio/20_english_5.mp3',
      'audio/21_fun_1.mp3', 'audio/22_fun_2.mp3', 'audio/23_fun_3.mp3', 'audio/24_fun_4.mp3',
      'audio/25_zhouhan_dialect.mp3', 'audio/26_yuhan_hesile.mp3', 'audio/27_come_on.mp3', 'audio/29_keep_going.mp3',
      'audio/30_no_fuel.mp3', 'audio/31_rocket_coming.mp3', 'audio/32_tank_unlocked.mp3', 'audio/33_zesen_flip_bomb.mp3',
      'audio/34_thunder_activated.mp3', 'audio/28_together_fight.mp3',
    ];
    // V4.2: 被击中随机语音（5条）
    this.hitAudioFiles = [
      'audio/hit_01_aiyo.mp3', 'audio/hit_02_how_dare_you.mp3', 'audio/hit_03_seek_revenge.mp3',
      'audio/hit_04_call_backup.mp3', 'audio/hit_05_destruction.mp3',
    ];
    // V4.1: 预加载所有音频
    this._preloadedAudio = [];
    this.celebrationAudioFiles.forEach(src => {
      const a = new Audio(src); a.preload = 'auto'; a.volume = 1.0;
      this._preloadedAudio.push(a);
    });
    this._preloadedHitAudio = [];
    this.hitAudioFiles.forEach(src => {
      const a = new Audio(src); a.preload = 'auto'; a.volume = 0.85;
      this._preloadedHitAudio.push(a);
    });
    // 预加载TTS语音列表（解决getVoices()首次返回空数组的问题）
    if (window.speechSynthesis) {
      const loadVoices = () => { this.cachedVoices = window.speechSynthesis.getVoices(); };
      loadVoices();
      window.speechSynthesis.addEventListener('voiceschanged', loadVoices);
    }
  }

  init() {
    if (this.initialized) {
      // 即使已初始化，也尝试resume（解决iframe中AudioContext被挂起的问题）
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume().catch(() => {});
      }
      return;
    }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.initialized = true;
      // iframe中AudioContext可能立即进入suspended状态
      if (this.ctx.state === 'suspended') {
        this.ctx.resume().catch(() => {});
      }
    } catch (e) {
      console.warn('AudioContext 初始化失败:', e);
    }
  }

  toggleMute() {
    this.muted = !this.muted;
    const btn = document.getElementById('muteBtn');
    if (btn) {
      btn.textContent = this.muted ? '🔇' : '🔊';
      btn.classList.toggle('muted', this.muted);
    }
  }

  _createOsc(type, freq, gainVal, startTime, duration) {
    if (!this.ctx || this.muted) return null;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, startTime);
    gain.gain.setValueAtTime(gainVal, startTime);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    return { osc, gain };
  }

  _createNoise(duration, gainVal, startTime) {
    if (!this.ctx || this.muted) return;
    const bufferSize = this.ctx.sampleRate * duration;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(gainVal, startTime);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    noise.connect(gain);
    gain.connect(this.ctx.destination);
    noise.start(startTime);
    noise.stop(startTime + duration);
  }

  playShoot() {
    // V4: 去掉持续滴滴声，射击不再发出音效
    return;
  }

  playExplosion() {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const { osc, gain } = this._createOsc('sawtooth', 150, 0.12, t, 0);
    if (!osc) return;
    osc.frequency.exponentialRampToValueAtTime(40, t + 0.2);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    osc.start(t);
    osc.stop(t + 0.2);
    this._createNoise(0.15, 0.08, t);
  }

  playMetalHit() {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const { osc, gain } = this._createOsc('square', 400, 0.06, t, 0);
    if (!osc) return;
    osc.frequency.setValueAtTime(600, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
    osc.start(t);
    osc.stop(t + 0.06);
  }

  playPlayerHit() {
    if (!this.ctx) return;
    // V4.2.1: 被击中语音 — 加大音量
    if (!this.muted && this._preloadedHitAudio && this._preloadedHitAudio.length > 0) {
      const idx = Math.floor(Math.random() * this._preloadedHitAudio.length);
      const hitAudio = this._preloadedHitAudio[idx];
      if (hitAudio) { hitAudio.volume = 1.0; try { hitAudio.currentTime = 0; hitAudio.play().catch(() => {}); } catch(e) {} }
    }
    // V4.2.1: 增强合成效果音 — 爆炸感更强
    if (this.muted) return;
    const t = this.ctx.currentTime;
    // 低频爆炸冲击
    const boom = this._createOsc('sawtooth', 120, 0.35, t, 0);
    if (boom) {
      boom.osc.frequency.exponentialRampToValueAtTime(40, t + 0.4);
      boom.gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      boom.osc.start(t); boom.osc.stop(t + 0.4);
    }
    // 高频碎裂
    const crack = this._createOsc('square', 600, 0.15, t, 0);
    if (crack) {
      crack.osc.frequency.exponentialRampToValueAtTime(150, t + 0.2);
      crack.gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      crack.osc.start(t); crack.osc.stop(t + 0.2);
    }
    // 噪声感白噪音（高频抖动）
    const noise = this._createOsc('sawtooth', 200, 0.2, t, 0);
    if (noise) {
      for (let i = 0; i < 8; i++) {
        noise.osc.frequency.setValueAtTime(150 + Math.random() * 500, t + i * 0.02);
      }
      noise.gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      noise.osc.start(t); noise.osc.stop(t + 0.25);
    }
  }

  playPowerUp() {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o1 = this._createOsc('sine', 600, 0.1, t, 0);
    if (!o1) return;
    o1.gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    o1.osc.start(t);
    o1.osc.stop(t + 0.1);
    const o2 = this._createOsc('sine', 1200, 0.1, t + 0.08, 0);
    if (o2) {
      o2.gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      o2.osc.start(t + 0.08);
      o2.osc.stop(t + 0.25);
    }
  }

  playShield() {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const { osc, gain } = this._createOsc('sawtooth', 1000, 0.06, t, 0);
    if (!osc) return;
    for (let i = 0; i < 8; i++) {
      osc.frequency.setValueAtTime(800 + Math.random() * 400, t + i * 0.025);
    }
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    osc.start(t);
    osc.stop(t + 0.2);
  }

  playBossWarning() {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    for (let i = 0; i < 3; i++) {
      const offset = i * 0.3;
      const o1 = this._createOsc('square', 600, 0.12, t + offset, 0);
      if (o1) {
        o1.gain.gain.setValueAtTime(0.12, t + offset);
        o1.gain.gain.exponentialRampToValueAtTime(0.001, t + offset + 0.12);
        o1.osc.start(t + offset);
        o1.osc.stop(t + offset + 0.12);
      }
      const o2 = this._createOsc('square', 800, 0.12, t + offset + 0.15, 0);
      if (o2) {
        o2.gain.gain.setValueAtTime(0.12, t + offset + 0.15);
        o2.gain.gain.exponentialRampToValueAtTime(0.001, t + offset + 0.27);
        o2.osc.start(t + offset + 0.15);
        o2.osc.stop(t + offset + 0.27);
      }
    }
  }

  playBossExplosion() {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o1 = this._createOsc('sawtooth', 80, 0.2, t, 0);
    if (o1) {
      o1.osc.frequency.exponentialRampToValueAtTime(20, t + 0.6);
      o1.gain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
      o1.osc.start(t);
      o1.osc.stop(t + 0.6);
    }
    const o2 = this._createOsc('square', 200, 0.1, t + 0.05, 0);
    if (o2) {
      o2.osc.frequency.exponentialRampToValueAtTime(50, t + 0.5);
      o2.gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      o2.osc.start(t + 0.05);
      o2.osc.stop(t + 0.5);
    }
    this._createNoise(0.5, 0.12, t);
    const o3 = this._createOsc('sawtooth', 120, 0.15, t + 0.3, 0);
    if (o3) {
      o3.osc.frequency.exponentialRampToValueAtTime(30, t + 0.8);
      o3.gain.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
      o3.osc.start(t + 0.3);
      o3.osc.stop(t + 0.8);
    }
    this._createNoise(0.3, 0.08, t + 0.3);
  }

  playGameOver() {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const notes = [500, 450, 380, 300, 200];
    for (let i = 0; i < notes.length; i++) {
      const o = this._createOsc('triangle', notes[i], 0.1, t + i * 0.15, 0);
      if (o) {
        o.gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.15 + 0.2);
        o.osc.start(t + i * 0.15);
        o.osc.stop(t + i * 0.15 + 0.2);
      }
    }
  }

  /** 答题正确 — 随机庆祝语音（V4.1: 本地高质量音频文件，edge-tts生成） */
  playCongraz() {
    if (this.muted) return;
    const idx = Math.floor(Math.random() * this.celebrationMessages.length);
    const text = this.celebrationMessages[idx];
    console.log('[Celebration] 播放:', text);
    // 显示庆祝文字气泡
    celebrationToast = text;
    celebrationToastTimer = 150;
    // ★ V4.1: 播放预加载的高质量本地音频（微软edge-tts，媲美真人）
    const audio = this._preloadedAudio[idx];
    if (audio) {
      try { audio.currentTime = 0; audio.play().catch(e => console.warn('[Celebration] 音频失败:', e)); } catch(e) {}
    }
    // ★ 合成庆祝音效（永远能响的保底）
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const notes = [523, 659, 784, 1047];
    for (let i = 0; i < notes.length; i++) {
      const o = this._createOsc('sine', notes[i], 0.25, t + i * 0.1, 0);
      if (o) { o.gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.1 + 0.35); o.osc.start(t + i * 0.1); o.osc.stop(t + i * 0.1 + 0.35); }
    }
    const chordNotes = [1047, 1319, 1568];
    for (let i = 0; i < chordNotes.length; i++) {
      const o = this._createOsc('sine', chordNotes[i], 0.15, t + 0.45 + i * 0.05, 0);
      if (o) { o.gain.gain.exponentialRampToValueAtTime(0.001, t + 1.2); o.osc.start(t + 0.45 + i * 0.05); o.osc.stop(t + 1.2); }
    }
    const o3 = this._createOsc('triangle', 2093, 0.1, t + 0.5, 0);
    if (o3) { o3.gain.gain.exponentialRampToValueAtTime(0.001, t + 1.0); o3.osc.start(t + 0.5); o3.osc.stop(t + 1.0); }
  }

  /** 答题错误 — 答错了，再想想 */
  playQuizWrong() {
    if (this.muted) return;
    // V4.1: 本地高质量音频
    const wrongAudio = new Audio('audio/wrong.mp3');
    wrongAudio.volume = 0.9;
    wrongAudio.play().catch(() => {});
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    // 下降音调 BUZZ
    const o1 = this._createOsc('sawtooth', 400, 0.12, t, 0);
    if (o1) {
      o1.osc.frequency.exponentialRampToValueAtTime(150, t + 0.25);
      o1.gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      o1.osc.start(t); o1.osc.stop(t + 0.3);
    }
  }

  playStageStart() {
    // V4.2: 播放本地高质量游戏开始语音
    if (!this.muted) {
      const startAudio = new Audio('audio/game_start.mp3');
      startAudio.volume = 1.0;
      startAudio.play().catch(() => {});
    }
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const notes = [300, 400, 500, 650, 800];
    for (let i = 0; i < notes.length; i++) {
      const o = this._createOsc('square', notes[i], 0.08, t + i * 0.1, 0);
      if (o) {
        o.gain.gain.setValueAtTime(0.08, t + i * 0.1);
        o.gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.1 + 0.15);
        o.osc.start(t + i * 0.1);
        o.osc.stop(t + i * 0.1 + 0.15);
      }
    }
  }

  /** V3新增：导弹发射音效 — 低频上升+嘶嘶声 */
  playMissile() {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o1 = this._createOsc('sawtooth', 100, 0.15, t, 0);
    if (o1) {
      o1.osc.frequency.exponentialRampToValueAtTime(400, t + 0.15);
      o1.gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      o1.osc.start(t);
      o1.osc.stop(t + 0.25);
    }
    this._createNoise(0.2, 0.06, t + 0.05);
  }

  /** V3新增：导弹命中爆炸 — 比普通爆炸更强烈 */
  playMissileHit() {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o1 = this._createOsc('sawtooth', 60, 0.25, t, 0);
    if (o1) {
      o1.osc.frequency.exponentialRampToValueAtTime(15, t + 0.5);
      o1.gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      o1.osc.start(t);
      o1.osc.stop(t + 0.5);
    }
    const o2 = this._createOsc('square', 300, 0.12, t + 0.03, 0);
    if (o2) {
      o2.osc.frequency.exponentialRampToValueAtTime(40, t + 0.4);
      o2.gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      o2.osc.start(t + 0.03);
      o2.osc.stop(t + 0.4);
    }
    this._createNoise(0.4, 0.15, t);
    this._createNoise(0.2, 0.1, t + 0.15);
  }

  /** V3新增：EMP释放音效 — 低频嗡嗡+高频闪烁 */
  playEMP() {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o1 = this._createOsc('sine', 60, 0.2, t, 0);
    if (o1) {
      o1.osc.frequency.exponentialRampToValueAtTime(120, t + 0.3);
      o1.gain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
      o1.osc.start(t);
      o1.osc.stop(t + 0.6);
    }
    for (let i = 0; i < 5; i++) {
      const o2 = this._createOsc('square', 800 + i * 200, 0.06, t + i * 0.06, 0);
      if (o2) {
        o2.gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.06 + 0.08);
        o2.osc.start(t + i * 0.06);
        o2.osc.stop(t + i * 0.06 + 0.08);
      }
    }
    this._createNoise(0.3, 0.08, t);
  }

  /** V3新增：武器解锁音效 — 上升音阶+叮叮叮三连音 */
  playWeaponUnlock() {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const notes = [400, 500, 600, 800, 1000];
    for (let i = 0; i < notes.length; i++) {
      const o = this._createOsc('triangle', notes[i], 0.1, t + i * 0.08, 0);
      if (o) {
        o.gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.12);
        o.osc.start(t + i * 0.08);
        o.osc.stop(t + i * 0.08 + 0.12);
      }
    }
    const t2 = t + 0.5;
    for (let i = 0; i < 3; i++) {
      const o = this._createOsc('sine', 1200 + i * 100, 0.12, t2 + i * 0.1, 0);
      if (o) {
        o.gain.gain.exponentialRampToValueAtTime(0.001, t2 + i * 0.1 + 0.15);
        o.osc.start(t2 + i * 0.1);
        o.osc.stop(t2 + i * 0.1 + 0.15);
      }
    }
  }
}

  let best = player.alive ? player : null;
  let bestDist = player.alive ? dist(fromX, fromY, player.x, player.y) : Infinity;
  if (player2 && player2.alive) {
    const d2 = dist(fromX, fromY, player2.x, player2.y);

class StarField {
  constructor() {
    this.layers = CFG.starLayers.map(cfg => {
      const stars = [];
      for (let i = 0; i < cfg.count; i++) {
        stars.push({ x: rand(0, W), y: rand(0, H), twinkle: rand(0, Math.PI * 2) });
      }
      return { ...cfg, stars };
    });
  }
  update() {
    for (const layer of this.layers) {
      for (const s of layer.stars) {
        s.y += layer.speed + difficulty * 0.1;
        s.twinkle += 0.03;
        if (s.y > H) { s.y = -2; s.x = rand(0, W); }
      }
    }
  }
  draw() {
    for (const layer of this.layers) {
      for (const s of layer.stars) {
        const a = layer.alpha * (0.6 + 0.4 * Math.sin(s.twinkle));
        ctx.fillStyle = `rgba(200,220,255,${a})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, layer.size, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
}

// ==================== 粒子系统 ====================

class Particle {
  constructor(x, y, vx, vy, life, color, size) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life; this.color = color; this.size = size;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.vx *= 0.97; this.vy *= 0.97;
    this.life--;
    return this.life > 0;
  }
  draw() {
    const t = this.life / this.maxLife;
    ctx.globalAlpha = t;
    ctx.fillStyle = this.color;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size * t, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ==================== 子弹类 ====================

class Bullet {
  constructor(x, y, vx, vy, isPlayer, damage, ownerIdx, isFire) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.isPlayer = isPlayer; this.damage = damage || 1;
    this.ownerIdx = ownerIdx !== undefined ? ownerIdx : 0; // V4: 0=P1, 1=P2
    this.isFire = !!isFire; // V4.2.1: 火焰子弹（穿透）
    this.w = isPlayer ? 6 : 8; this.h = isPlayer ? 16 : 12;
    this.alive = true;
    this.fireTrail = 0; // 火焰拖尾计数器
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    if (this.y < -20 || this.y > H + 20 || this.x < -20 || this.x > W + 20) this.alive = false;
    // V4.2.1: 火焰子弹拖尾粒子
    if (this.isFire && this.alive) {
      this.fireTrail++;
      if (this.fireTrail % 2 === 0) {
        const colors = ['#ff2200', '#ff6600', '#ff9900', '#ffcc00'];
        particles.push(new Particle(
          this.x + rand(-3, 3), this.y + 8,
          rand(-0.5, 0.5), rand(1, 2),
          randInt(8, 16), colors[randInt(0, colors.length - 1)], rand(2, 5)
        ));
      }
    }
  }
  draw() {
    ctx.save();
    // V4: P2子弹用橙色系
    const p2 = this.ownerIdx === 1;
    if (this.isPlayer) {
      // V4.2.1: 火焰子弹 — 独特红橙火焰效果
      if (this.isFire) {
        const flicker = 0.8 + 0.2 * Math.sin(Date.now() * 0.02 + this.x);
        const grd = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, 14 * flicker);
        grd.addColorStop(0, 'rgba(255,255,200,0.95)');
        grd.addColorStop(0.25, 'rgba(255,160,0,0.7)');
        grd.addColorStop(0.5, 'rgba(255,60,0,0.4)');
        grd.addColorStop(1, 'rgba(255,0,0,0)');
        ctx.fillStyle = grd; ctx.fillRect(this.x - 14, this.y - 16, 28, 32);
        // 火焰核心
        ctx.fillStyle = '#ffee44'; ctx.fillRect(this.x - 3, this.y - 10, 6, 20);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(this.x - 1.5, this.y - 8, 3, 16);
        // 侧面火舌
        ctx.globalAlpha = 0.5 * flicker;
        ctx.fillStyle = '#ff4400';
        ctx.beginPath(); ctx.arc(this.x - 5, this.y + 4, 4, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(this.x + 5, this.y + 6, 3.5, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      } else if (this.damage >= 3) {
        const grd = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, 10);
        grd.addColorStop(0, p2 ? 'rgba(255,180,50,0.95)' : 'rgba(255,200,50,0.95)');
        grd.addColorStop(0.4, p2 ? 'rgba(255,80,0,0.5)' : 'rgba(255,100,0,0.5)');
        grd.addColorStop(1, 'rgba(255,50,0,0)');
        ctx.fillStyle = grd; ctx.fillRect(this.x - 10, this.y - 12, 20, 24);
        ctx.fillStyle = p2 ? '#ff8800' : '#ffaa00'; ctx.fillRect(this.x - 2.5, this.y - 9, 5, 18);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(this.x - 1, this.y - 7, 2, 14);
      } else if (this.damage >= 2) {
        const grd = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, 9);
        grd.addColorStop(0, p2 ? 'rgba(255,150,50,0.9)' : 'rgba(50,255,150,0.9)');
        grd.addColorStop(0.5, p2 ? 'rgba(255,100,0,0.4)' : 'rgba(0,200,100,0.4)');
        grd.addColorStop(1, p2 ? 'rgba(200,50,0,0)' : 'rgba(0,100,50,0)');
        ctx.fillStyle = grd; ctx.fillRect(this.x - 9, this.y - 11, 18, 22);

// ==================== 追踪弹类（Boss专用） ====================

class HomingBullet {
  constructor(x, y, targetX, targetY, speed) {
    this.x = x; this.y = y;
    this.speed = speed || CFG.homingBulletSpeed;
    this.alive = true; this.w = 10; this.h = 10; this.turnRate = 0.03;
    const angle = Math.atan2(targetY - y, targetX - x);
    this.vx = Math.cos(angle) * this.speed;
    this.vy = Math.sin(angle) * this.speed;
    this.age = 0; this.maxAge = 300;
  }
  update() {
    this.age++;
    if (this.age > this.maxAge) { this.alive = false; return; }
    if (player.alive) {
      const tgt = nearestAlivePlayer(this.x, this.y) || player;
      const targetAngle = Math.atan2(tgt.y - this.y, tgt.x - this.x);
      const currentAngle = Math.atan2(this.vy, this.vx);
      let angleDiff = targetAngle - currentAngle;
      while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
      while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
      const turn = clamp(angleDiff, -this.turnRate, this.turnRate);
      const newAngle = currentAngle + turn;
      this.vx = Math.cos(newAngle) * this.speed;
      this.vy = Math.sin(newAngle) * this.speed;
    }
    this.x += this.vx; this.y += this.vy;
    if (this.x < -30 || this.x > W + 30 || this.y < -30 || this.y > H + 30) this.alive = false;
  }
  draw() {
    ctx.save();
    const grd = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, 8);
    grd.addColorStop(0, 'rgba(255,50,200,0.9)');
    grd.addColorStop(0.5, 'rgba(200,0,150,0.4)');
    grd.addColorStop(1, 'rgba(100,0,80,0)');
    ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(this.x, this.y, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff66cc'; ctx.beginPath(); ctx.arc(this.x, this.y, 3, 0, Math.PI * 2); ctx.fill();
    for (let i = 1; i <= 3; i++) {
      const alpha = 0.3 * (1 - i / 4);
      ctx.fillStyle = `rgba(255,50,200,${alpha})`;
      ctx.beginPath(); ctx.arc(this.x - this.vx * i * 2, this.y - this.vy * i * 2, 4 - i, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  getRect() { return { x: this.x - this.w / 2, y: this.y - this.h / 2, w: this.w, h: this.h }; }
}

// ==================== 激光预警线类 ====================

class LaserWarning {
  constructor(boss, targetX) {
    this.boss = boss; this.x = targetX;
    this.timer = CFG.laserWarningFrames; this.active = false;
    this.laserTimer = 0; this.done = false; this.hasHit = false;
  }
  update() {
    if (!this.active) {
      this.timer--;
      if (this.timer <= 0) { this.active = true; this.laserTimer = CFG.laserActiveFrames; audio.playMetalHit(); }
    } else {
      this.laserTimer--;
      if (this.laserTimer <= 0) this.done = true;
    }
  }
  draw() {
    if (!this.active) {
      if (Math.sin(this.timer * 0.3) > 0) {
        ctx.save(); ctx.strokeStyle = 'rgba(255,50,50,0.5)'; ctx.lineWidth = 2; ctx.setLineDash([8, 6]);
        ctx.beginPath(); ctx.moveTo(this.x, this.boss.y + this.boss.h / 2); ctx.lineTo(this.x, H);
        ctx.stroke(); ctx.setLineDash([]); ctx.restore();
      }
    } else {
      const intensity = this.laserTimer / CFG.laserActiveFrames;
      ctx.save();
      ctx.globalAlpha = intensity * 0.3; ctx.fillStyle = '#ff0000';
      ctx.fillRect(this.x - 16, this.boss.y + this.boss.h / 2, 32, H - this.boss.y);
      ctx.globalAlpha = intensity * 0.6; ctx.fillStyle = '#ff3300';
      ctx.fillRect(this.x - 8, this.boss.y + this.boss.h / 2, 16, H - this.boss.y);
      ctx.globalAlpha = intensity * 0.9; ctx.fillStyle = '#ffffff';
      ctx.fillRect(this.x - 3, this.boss.y + this.boss.h / 2, 6, H - this.boss.y);
      ctx.restore();
    }
  }
  hitsPlayer(p) {
    const tgt = p || player; // 兼容旧调用
    if (!this.active || this.hasHit) return false;
    if (Math.abs(tgt.x - this.x) < 10 + tgt.w / 2) {
      if (tgt.alive && tgt.invincible <= 0) { this.hasHit = true; return true; }
    }
    return false;
  }
}

const POWERUP_TYPES = ['heal', 'double', 'shield', 'missile', 'power', 'fire', 'drone'];
const POWERUP_COLORS = { heal: '#44ff44', double: '#ffaa00', shield: '#44aaff', missile: '#ff3333', power: '#ffdd00', fire: '#ff4400', drone: '#00ff88' };
const POWERUP_LABELS = { heal: '+', double: 'D', shield: 'S', missile: 'M', power: 'P', fire: 'F', drone: 'U' };

class PowerUp {
  constructor(x, y, type) {
    this.x = x; this.y = y; this.type = type;
    this.w = CFG.powerUpSize * 2; this.h = CFG.powerUpSize * 2;
    this.alive = true; this.phase = rand(0, Math.PI * 2);
  }
  update() {
    this.y += CFG.powerUpSpeed; this.phase += 0.08;
    if (this.y > H + 30) this.alive = false;
  }
  draw() {
    const pulse = 0.7 + 0.3 * Math.sin(this.phase);
    const color = POWERUP_COLORS[this.type];
    const r = CFG.powerUpSize * pulse;
    ctx.save();
    if (this.type === 'missile') {
      // 导弹道具：红色菱形+M标签
      ctx.globalAlpha = 0.3 * pulse; ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(this.x, this.y, r * 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.9; ctx.fillStyle = color;
      ctx.beginPath(); ctx.moveTo(this.x, this.y - r); ctx.lineTo(this.x + r, this.y);
      ctx.lineTo(this.x, this.y + r); ctx.lineTo(this.x - r, this.y); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.moveTo(this.x, this.y - r * 0.45); ctx.lineTo(this.x + r * 0.45, this.y);
      ctx.lineTo(this.x, this.y + r * 0.45); ctx.lineTo(this.x - r * 0.45, this.y); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#000'; ctx.font = `bold ${Math.round(r * 0.9)}px Courier New`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('M', this.x, this.y + 1);
    } else if (this.type === 'power') {
      // 子弹升级道具：金色闪电形+P标签
      ctx.globalAlpha = 0.3 * pulse; ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(this.x, this.y, r * 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.9; ctx.fillStyle = color;
      // 闪电形状
      ctx.beginPath();
      ctx.moveTo(this.x - r * 0.2, this.y - r);
      ctx.lineTo(this.x + r * 0.5, this.y - r);
      ctx.lineTo(this.x + r * 0.05, this.y - r * 0.1);
      ctx.lineTo(this.x + r * 0.6, this.y - r * 0.1);
      ctx.lineTo(this.x - r * 0.15, this.y + r);
      ctx.lineTo(this.x + r * 0.1, this.y + r * 0.15);
      ctx.lineTo(this.x - r * 0.5, this.y + r * 0.15);
      ctx.closePath(); ctx.fill();
      // 白色高光
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(this.x - r * 0.1, this.y - r * 0.7);
      ctx.lineTo(this.x + r * 0.25, this.y - r * 0.7);
      ctx.lineTo(this.x + r * 0.02, this.y - r * 0.15);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#000'; ctx.font = `bold ${Math.round(r * 0.8)}px Courier New`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';       ctx.fillText('P', this.x, this.y + r * 0.55);
    } else if (this.type === 'fire') {
      // V4.2.1: 火焰道具 — 火焰形状+闪烁
      ctx.globalAlpha = 0.3 * pulse; ctx.fillStyle = '#ff4400';
      ctx.beginPath(); ctx.arc(this.x, this.y, r * 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.9;
      // 火焰外焰（橙红）
      ctx.fillStyle = '#ff4400';
      ctx.beginPath();
      ctx.moveTo(this.x, this.y - r * 1.1);
      ctx.quadraticCurveTo(this.x + r * 0.8, this.y - r * 0.3, this.x + r * 0.5, this.y + r * 0.7);
      ctx.quadraticCurveTo(this.x, this.y + r * 0.4, this.x - r * 0.5, this.y + r * 0.7);
      ctx.quadraticCurveTo(this.x - r * 0.8, this.y - r * 0.3, this.x, this.y - r * 1.1);
      ctx.fill();
      // 火焰内焰（黄橙）
      ctx.fillStyle = '#ffaa00';
      ctx.beginPath();
      ctx.moveTo(this.x, this.y - r * 0.7);
      ctx.quadraticCurveTo(this.x + r * 0.4, this.y - r * 0.1, this.x + r * 0.25, this.y + r * 0.4);
      ctx.quadraticCurveTo(this.x, this.y + r * 0.2, this.x - r * 0.25, this.y + r * 0.4);
      ctx.quadraticCurveTo(this.x - r * 0.4, this.y - r * 0.1, this.x, this.y - r * 0.7);
      ctx.fill();
      // 火焰核心（白黄）
      ctx.fillStyle = '#ffee66';
      ctx.beginPath();
      ctx.moveTo(this.x, this.y - r * 0.35);
      ctx.quadraticCurveTo(this.x + r * 0.15, this.y, this.x + r * 0.1, this.y + r * 0.2);
      ctx.quadraticCurveTo(this.x, this.y + r * 0.1, this.x - r * 0.1, this.y + r * 0.2);
      ctx.quadraticCurveTo(this.x - r * 0.15, this.y, this.x, this.y - r * 0.35);
      ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.round(r * 0.7)}px Courier New`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('F', this.x, this.y + r * 0.5);
    } else if (this.type === 'drone') {
      // V4.3: 无人机道具 — 绿色十字+U标签
      ctx.globalAlpha = 0.3 * pulse; ctx.fillStyle = '#00ff88';
      ctx.beginPath(); ctx.arc(this.x, this.y, r * 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.9;
      // 十字形
      ctx.fillStyle = '#00ff88';
      ctx.fillRect(this.x - r * 0.3, this.y - r, r * 0.6, r * 2);
      ctx.fillRect(this.x - r, this.y - r * 0.3, r * 2, r * 0.6);
      // 中心圆
      ctx.fillStyle = '#00ff88'; ctx.beginPath(); ctx.arc(this.x, this.y, r * 0.45, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#003311'; ctx.font = `bold ${Math.round(r * 0.8)}px Courier New`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('U', this.x, this.y + 1);
    } else {
      ctx.globalAlpha = 0.3 * pulse; ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(this.x, this.y, r * 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.9; ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(this.x, this.y, r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1; ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(this.x, this.y, r * 0.45, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#000'; ctx.font = `bold ${Math.round(r * 0.9)}px Courier New`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(POWERUP_LABELS[this.type], this.x, this.y + 1);
    }
    ctx.restore();
  }
  getRect() { return { x: this.x - this.w / 2, y: this.y - this.h / 2, w: this.w, h: this.h }; }
}

// ==================== V3: 导弹类（玩家发射） ====================

class Missile {
  constructor(x, y, target) {
    this.x = x; this.y = y; this.target = target;
    this.speed = CFG.missileSpeed; this.turnRate = CFG.missileTurnRate;
    this.alive = true; this.w = 14; this.h = 28; this.phase = rand(0, Math.PI * 2);
    this.vx = 0; this.vy = -this.speed;
  }
  update() {
    this.phase += 0.1;
    // 追踪目标
    if (this.target && this.target.alive) {
      const targetAngle = Math.atan2(this.target.y - this.y, this.target.x - this.x);
      const currentAngle = Math.atan2(this.vy, this.vx);
      let angleDiff = targetAngle - currentAngle;
      while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
      while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
      const turn = clamp(angleDiff, -this.turnRate, this.turnRate);
      const newAngle = currentAngle + turn;
      this.vx = Math.cos(newAngle) * this.speed;
      this.vy = Math.sin(newAngle) * this.speed;
    }
    this.x += this.vx; this.y += this.vy;
    if (this.x < -30 || this.x > W + 30 || this.y < -30 || this.y > H + 30) this.alive = false;
  }
  draw() {
    ctx.save();
    const angle = Math.atan2(this.vy, this.vx) + Math.PI / 2;
    ctx.translate(this.x, this.y); ctx.rotate(angle);
    // 导弹体
    ctx.fillStyle = '#cc2200';
    ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(-5, -4); ctx.lineTo(-5, 10);
    ctx.lineTo(5, 10); ctx.lineTo(5, -4); ctx.closePath(); ctx.fill();
    // 弹头白色
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(-3, -6); ctx.lineTo(3, -6); ctx.closePath(); ctx.fill();
    // 尾翼
    ctx.fillStyle = '#cc2200';
    ctx.beginPath(); ctx.moveTo(-5, 6); ctx.lineTo(-9, 12); ctx.lineTo(-5, 10); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(5, 6); ctx.lineTo(9, 12); ctx.lineTo(5, 10); ctx.closePath(); ctx.fill();
    // 橙色尾焰
    const flameLen = 8 + 6 * Math.sin(this.phase * 3);
    const flameGrd = ctx.createLinearGradient(0, 10, 0, 10 + flameLen);
    flameGrd.addColorStop(0, 'rgba(255,150,0,0.9)');
    flameGrd.addColorStop(0.5, 'rgba(255,80,0,0.5)');
    flameGrd.addColorStop(1, 'rgba(255,30,0,0)');
    ctx.fillStyle = flameGrd;
    ctx.beginPath(); ctx.moveTo(-3, 10); ctx.lineTo(0, 10 + flameLen); ctx.lineTo(3, 10); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  getRect() { return { x: this.x - this.w / 2, y: this.y - this.h / 2, w: this.w, h: this.h }; }
}
