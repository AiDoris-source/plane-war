// ==================== 敌机类 ====================

let enemyIdCounter = 0;

class Enemy {
  constructor(type, x, y) {
    const cfg = CFG.enemies[type];
    this.id = ++enemyIdCounter;
    this.type = type; this.x = x; this.y = y;
    this.w = cfg.w; this.h = cfg.h;
    this.hp = Math.ceil(cfg.hp * _diffEnemyHPMult); this.maxHp = this.hp;
    this.speed = (cfg.speed + difficulty * 0.3) * _diffEnemySpeedMult;
    this.score = cfg.score; this.fireRate = cfg.fireRate;
    this.fireCooldown = cfg.fireRate > 0 ? randInt(30, cfg.fireRate) : 0;
    this.color = cfg.color; this.alive = true;
    this.phase = rand(0, Math.PI * 2);
    this.sway = type === 'fast' ? rand(0.5, 1.5) : 0;
    this.swaySpeed = rand(0.02, 0.05);
    this.swayPhase = rand(0, Math.PI * 2);
    this.baseX = x;
    // zigzag 之字形参数
    this.zigzagPhase = rand(0, Math.PI * 2);
    this.zigzagAmplitude = rand(60, 100);
    this.zigzagSpeed = rand(0.03, 0.06);
    // stealth 隐身参数
    this.stealthTimer = rand(0, 300);
    this.stealthAlpha = 1;
    // formation 编队参数
    this.formationId = 0; this.formationIndex = 0;
    this.formationLeaderX = x; this.formationScattered = false; this.scatterVx = 0;
    // V3: EMP眩晕参数
    this.stunned = false; this.stunTimer = 0;
  }

  update() {
    // 眩晕状态不移动不射击
    if (this.stunned) {
      this.stunTimer--;
      if (this.stunTimer <= 0) this.stunned = false;
      return;
    }
    this.y += this.speed; this.phase += 0.05;
    if (this.sway > 0) {
      this.swayPhase += this.swaySpeed;
      this.x = this.baseX + Math.sin(this.swayPhase) * 40 * this.sway;
    }
    // zigzag 之字形移动
    if (this.type === 'zigzag') {
      this.zigzagPhase += this.zigzagSpeed;
      this.x = this.baseX + Math.sin(this.zigzagPhase) * this.zigzagAmplitude;
      this.x = clamp(this.x, this.w / 2, W - this.w / 2);
    }
    // stealth 隐身逻辑
    if (this.type === 'stealth') {
      this.stealthTimer++;
      const cycle = this.stealthTimer % 300;
      this.stealthAlpha = cycle < 180 ? 1 : 0.15;
    }
    // formation 编队逻辑
    if (this.type === 'formation') {
      if (!this.formationScattered) {
        const offsets = [0, -25, 25];
        this.x = this.formationLeaderX + offsets[this.formationIndex];
      } else {
        this.x += this.scatterVx;
        this.speed = Math.min(this.speed * 1.01, 5);
      }
    }
    // large敌机射击（向前射击）
    if (this.type === 'large' && this.fireRate > 0) {
      this.fireCooldown--;
      if (this.fireCooldown <= 0) {
        this.fireCooldown = this.fireRate;
        for (let a = -0.3; a <= 0.3; a += 0.3) {
          bullets.push(new Bullet(this.x, this.y + this.h / 2, Math.sin(a) * 2, 3 + Math.cos(a), false, 1));
        }
      }
    }
    // V3: bomber投弹（向下投弹）
    if (this.type === 'bomber' && this.fireRate > 0) {
      this.fireCooldown--;
      if (this.fireCooldown <= 0) {
        this.fireCooldown = this.fireRate;
        bombs.push(new Bomb(this.x, this.y + this.h / 2));
      }
    }
    // V3.3: splitter 分裂机 — 被击毁时分裂成2架小机
    // (分裂逻辑在onEnemyKilled中处理)
    // V3.3: charger 俯冲机 — 到达玩家Y轴上方时俯冲加速
    if (this.type === 'charger') {
      if (this.y > player.y - 200 && this.y < player.y - 50 && this.speed < 8) {
        this.speed = Math.min(this.speed + 0.15, 8);
        this.x += (player.x - this.x) * 0.02;
      }
    }
    // V3.3: shielder 护盾机 — 有护盾需要打2次
    // (护盾逻辑在draw中展示，HP已包含护盾)
    if (this.type === 'shielder' && this.fireRate > 0) {
      this.fireCooldown--;
      if (this.fireCooldown <= 0) {
        this.fireCooldown = this.fireRate;
        // 三连弹
        for (let a = -0.2; a <= 0.2; a += 0.2) {
          bullets.push(new Bullet(this.x, this.y + this.h / 2, Math.sin(a) * 1.5, 3, false, 1));
        }
      }
    }
    // V3.3: swarm 蜂群机 — 高速小幅波动
    if (this.type === 'swarm') {
      this.x += Math.sin(this.phase * 3) * 1.5;
      this.x = clamp(this.x, this.w / 2, W - this.w / 2);
    }
    // V3.3: elite 精英机 — 左右横移+三连射
    if (this.type === 'elite') {
      this.x = this.baseX + Math.sin(this.phase) * 80;
      this.x = clamp(this.x, this.w / 2 + 10, W - this.w / 2 - 10);
      if (this.fireRate > 0) {
        this.fireCooldown--;
        if (this.fireCooldown <= 0) {
          this.fireCooldown = this.fireRate;
          for (let a = -0.4; a <= 0.4; a += 0.2) {
            bullets.push(new Bullet(this.x, this.y + this.h / 2, Math.sin(a) * 2.5, 3.5, false, 2));
          }
        }
      }
    }
    // V4.3: titan 超大型敌机 — 慢速+圆形弹幕
    if (this.type === 'titan' && this.fireRate > 0) {
      this.fireCooldown--;
      if (this.fireCooldown <= 0) {
        this.fireCooldown = this.fireRate;
        // 圆形弹幕（8方向）
        for (let i = 0; i < 8; i++) {
          const a = (Math.PI * 2 / 8) * i + this.phase * 0.3;
          bullets.push(new Bullet(this.x, this.y + this.h / 2, Math.sin(a) * 2, Math.cos(a) * 2 + 1.5, false, 2));
        }
      }
    }
    if (this.y > H + 60) this.alive = false;
  }

  draw() {
    ctx.save();
    const cx = this.x, cy = this.y;
    const hw = this.w / 2, hh = this.h / 2;

    // 隐身机透明度
    if (this.type === 'stealth') ctx.globalAlpha = this.stealthAlpha;
    // 眩晕闪烁
    if (this.stunned) ctx.globalAlpha = 0.3 + 0.3 * Math.sin(frameCount * 0.3);

    if (this.type === 'normal') {
      ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.moveTo(cx, cy + hh); ctx.lineTo(cx - hw, cy - hh * 0.4);
      ctx.lineTo(cx - hw * 0.3, cy - hh); ctx.lineTo(cx + hw * 0.3, cy - hh);
      ctx.lineTo(cx + hw, cy - hh * 0.4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ff8888'; ctx.beginPath();
      ctx.ellipse(cx, cy - hh * 0.1, hw * 0.25, hh * 0.3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(255,200,50,${0.5 + 0.3 * Math.sin(this.phase * 3)})`;
      ctx.beginPath(); ctx.arc(cx, cy - hh, 3, 0, Math.PI * 2); ctx.fill();
    } else if (this.type === 'fast') {
      ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.moveTo(cx, cy + hh); ctx.lineTo(cx - hw * 0.6, cy - hh * 0.2);
      ctx.lineTo(cx - hw, cy - hh); ctx.lineTo(cx, cy - hh * 0.5);
      ctx.lineTo(cx + hw, cy - hh); ctx.lineTo(cx + hw * 0.6, cy - hh * 0.2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffdd88'; ctx.beginPath();
      ctx.ellipse(cx, cy, hw * 0.2, hh * 0.25, 0, 0, Math.PI * 2); ctx.fill();
    } else if (this.type === 'large') {
      ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.moveTo(cx, cy + hh); ctx.lineTo(cx - hw * 0.4, cy + hh * 0.6);
      ctx.lineTo(cx - hw, cy + hh * 0.1); ctx.lineTo(cx - hw * 0.9, cy - hh * 0.3);
      ctx.lineTo(cx - hw * 0.4, cy - hh); ctx.lineTo(cx + hw * 0.4, cy - hh);
      ctx.lineTo(cx + hw * 0.9, cy - hh * 0.3); ctx.lineTo(cx + hw, cy + hh * 0.1);
      ctx.lineTo(cx + hw * 0.4, cy + hh * 0.6); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#dd88ff'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(cx - hw * 0.5, cy - hh * 0.5);
      ctx.lineTo(cx, cy + hh * 0.3); ctx.lineTo(cx + hw * 0.5, cy - hh * 0.5); ctx.stroke();
      ctx.fillStyle = '#aa44dd'; ctx.beginPath();
      ctx.ellipse(cx, cy - hh * 0.2, hw * 0.3, hh * 0.25, 0, 0, Math.PI * 2); ctx.fill();
      const glow = 0.5 + 0.3 * Math.sin(this.phase * 2);
      ctx.fillStyle = `rgba(200,100,255,${glow})`;
      ctx.beginPath(); ctx.arc(cx - hw * 0.3, cy - hh, 4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + hw * 0.3, cy - hh, 4, 0, Math.PI * 2); ctx.fill();
      if (this.hp < this.maxHp) {
        const bx = cx - this.w / 2, by = cy - hh - 8;
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(bx, by, this.w, 4);
        ctx.fillStyle = '#ff3333'; ctx.fillRect(bx, by, this.w * (this.hp / this.maxHp), 4);
      }
    } else if (this.type === 'zigzag') {
      // 绿色菱形 + 尾焰
      ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.moveTo(cx, cy - hh); ctx.lineTo(cx + hw, cy);
      ctx.lineTo(cx, cy + hh); ctx.lineTo(cx - hw, cy); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#88ffbb';
      ctx.beginPath(); ctx.moveTo(cx, cy - hh * 0.5); ctx.lineTo(cx + hw * 0.4, cy);
      ctx.lineTo(cx, cy + hh * 0.5); ctx.lineTo(cx - hw * 0.4, cy); ctx.closePath(); ctx.fill();
      const fGlow = 0.5 + 0.4 * Math.sin(this.phase * 4);
      ctx.fillStyle = `rgba(68,255,136,${fGlow})`; ctx.beginPath();
      ctx.arc(cx, cy - hh, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(200,255,200,${fGlow * 0.5})`; ctx.beginPath();
      ctx.arc(cx, cy - hh - 5, 3, 0, Math.PI * 2); ctx.fill();
    } else if (this.type === 'bomber') {
      // 棕红色圆胖形 + 机翼
      ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.ellipse(cx, cy, hw * 0.7, hh * 0.8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#aa4422';
      ctx.beginPath(); ctx.moveTo(cx - hw * 0.4, cy - hh * 0.1); ctx.lineTo(cx - hw, cy + hh * 0.2);
      ctx.lineTo(cx - hw * 0.9, cy + hh * 0.5); ctx.lineTo(cx - hw * 0.3, cy + hh * 0.3); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx + hw * 0.4, cy - hh * 0.1); ctx.lineTo(cx + hw, cy + hh * 0.2);
      ctx.lineTo(cx + hw * 0.9, cy + hh * 0.5); ctx.lineTo(cx + hw * 0.3, cy + hh * 0.3); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffaa66'; ctx.beginPath();
      ctx.ellipse(cx, cy - hh * 0.15, hw * 0.2, hh * 0.2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#663322'; ctx.beginPath();
      ctx.ellipse(cx, cy + hh * 0.5, 4, 3, 0, 0, Math.PI * 2); ctx.fill();
      if (this.hp < this.maxHp) {
        const bx = cx - this.w / 2, by = cy - hh - 8;
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(bx, by, this.w, 4);
        ctx.fillStyle = '#ff3333'; ctx.fillRect(bx, by, this.w * (this.hp / this.maxHp), 4);
      }
    } else if (this.type === 'stealth') {
      // 半透明银灰色三角
      ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.moveTo(cx, cy + hh); ctx.lineTo(cx - hw, cy - hh * 0.6);
      ctx.lineTo(cx - hw * 0.3, cy - hh); ctx.lineTo(cx + hw * 0.3, cy - hh);
      ctx.lineTo(cx + hw, cy - hh * 0.6); ctx.closePath(); ctx.fill();
      if (this.stealthAlpha < 0.5) {
        ctx.strokeStyle = 'rgba(170,187,204,0.3)'; ctx.lineWidth = 1; ctx.stroke();
      }
      ctx.fillStyle = '#ccddee'; ctx.beginPath();
      ctx.ellipse(cx, cy - hh * 0.2, hw * 0.15, hh * 0.2, 0, 0, Math.PI * 2); ctx.fill();
    } else if (this.type === 'formation') {
      // 亮蓝色小战机
      ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.moveTo(cx, cy + hh); ctx.lineTo(cx - hw * 0.5, cy);
      ctx.lineTo(cx - hw, cy - hh * 0.3); ctx.lineTo(cx - hw * 0.3, cy - hh * 0.5);
      ctx.lineTo(cx, cy - hh); ctx.lineTo(cx + hw * 0.3, cy - hh * 0.5);
      ctx.lineTo(cx + hw, cy - hh * 0.3); ctx.lineTo(cx + hw * 0.5, cy); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#88bbff'; ctx.beginPath();
      ctx.ellipse(cx, cy - hh * 0.15, hw * 0.15, hh * 0.2, 0, 0, Math.PI * 2); ctx.fill();
      const fG = 0.5 + 0.4 * Math.sin(this.phase * 4);
      ctx.fillStyle = `rgba(68,136,255,${fG})`; ctx.beginPath();
      ctx.arc(cx, cy - hh, 3, 0, Math.PI * 2); ctx.fill();
      if (this.hp < this.maxHp) {
        const bx = cx - this.w / 2, by = cy - hh - 6;
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(bx, by, this.w, 3);
        ctx.fillStyle = '#ff3333'; ctx.fillRect(bx, by, this.w * (this.hp / this.maxHp), 3);
      }
    } else if (this.type === 'splitter') {
      // 粉红色圆角+分裂标记
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.moveTo(cx - hw * 0.3, cy - hh); ctx.lineTo(cx + hw * 0.3, cy - hh);
      ctx.quadraticCurveTo(cx + hw, cy - hh, cx + hw, cy - hh * 0.3);
      ctx.lineTo(cx + hw * 0.5, cy + hh);
      ctx.lineTo(cx - hw * 0.5, cy + hh);
      ctx.lineTo(cx - hw, cy - hh * 0.3);
      ctx.quadraticCurveTo(cx - hw, cy - hh, cx - hw * 0.3, cy - hh);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffaadd'; ctx.beginPath();
      ctx.ellipse(cx, cy - hh * 0.1, hw * 0.25, hh * 0.2, 0, 0, Math.PI * 2); ctx.fill();
      // 分裂标记：两个小三角
      ctx.fillStyle = '#ff44aa';
      ctx.beginPath(); ctx.moveTo(cx - hw * 0.4, cy + hh * 0.1); ctx.lineTo(cx - hw * 0.1, cy - hh * 0.3); ctx.lineTo(cx - hw * 0.1, cy + hh * 0.1); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx + hw * 0.4, cy + hh * 0.1); ctx.lineTo(cx + hw * 0.1, cy - hh * 0.3); ctx.lineTo(cx + hw * 0.1, cy + hh * 0.1); ctx.closePath(); ctx.fill();
      if (this.hp < this.maxHp) {
        const bx = cx - this.w / 2, by = cy - hh - 8;
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(bx, by, this.w, 4);
        ctx.fillStyle = '#ff3333'; ctx.fillRect(bx, by, this.w * (this.hp / this.maxHp), 4);
      }
    } else if (this.type === 'charger') {
      // 红色尖锐俯冲形
      ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.moveTo(cx, cy + hh * 1.2); ctx.lineTo(cx - hw * 0.3, cy);
      ctx.lineTo(cx - hw, cy - hh * 0.5); ctx.lineTo(cx - hw * 0.5, cy - hh);
      ctx.lineTo(cx, cy - hh * 0.4); ctx.lineTo(cx + hw * 0.5, cy - hh);
      ctx.lineTo(cx + hw, cy - hh * 0.5); ctx.lineTo(cx + hw * 0.3, cy); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffaa44'; ctx.beginPath();
      ctx.ellipse(cx, cy - hh * 0.1, hw * 0.15, hh * 0.2, 0, 0, Math.PI * 2); ctx.fill();
      // 俯冲速度线
      if (this.speed > 4) {
        ctx.strokeStyle = 'rgba(255,100,50,0.6)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cx, cy - hh); ctx.lineTo(cx, cy - hh - 15); ctx.stroke();
      }
    } else if (this.type === 'shielder') {
      // 青色六边形+护盾光环
      ctx.fillStyle = this.color;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = Math.PI / 3 * i - Math.PI / 2;
        const px = cx + hw * 0.85 * Math.cos(a), py = cy + hh * 0.85 * Math.sin(a);
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#66eeee'; ctx.beginPath();
      ctx.ellipse(cx, cy, hw * 0.25, hh * 0.25, 0, 0, Math.PI * 2); ctx.fill();
      // 护盾光环
      const shieldGlow = 0.3 + 0.2 * Math.sin(this.phase * 2);
      ctx.strokeStyle = `rgba(68,204,204,${shieldGlow})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, hw + 5, 0, Math.PI * 2); ctx.stroke();
      if (this.hp < this.maxHp) {
        const bx = cx - this.w / 2, by = cy - hh - 10;
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(bx, by, this.w, 4);
        ctx.fillStyle = '#44cccc'; ctx.fillRect(bx, by, this.w * (this.hp / this.maxHp), 4);
      }
    } else if (this.type === 'swarm') {
      // 金黄色小三角
      ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.moveTo(cx, cy + hh); ctx.lineTo(cx - hw, cy - hh);
      ctx.lineTo(cx + hw, cy - hh); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffee88'; ctx.beginPath();
      ctx.arc(cx, cy - hh * 0.2, hw * 0.2, 0, Math.PI * 2); ctx.fill();
      const swGlow = 0.5 + 0.4 * Math.sin(this.phase * 5);
      ctx.fillStyle = `rgba(221,204,51,${swGlow})`; ctx.beginPath();
      ctx.arc(cx, cy - hh - 3, 2, 0, Math.PI * 2); ctx.fill();
    } else if (this.type === 'elite') {
      // 橙红色重型战机
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.moveTo(cx, cy + hh); ctx.lineTo(cx - hw * 0.3, cy + hh * 0.4);
      ctx.lineTo(cx - hw, cy + hh * 0.1); ctx.lineTo(cx - hw * 0.9, cy - hh * 0.4);
      ctx.lineTo(cx - hw * 0.5, cy - hh); ctx.lineTo(cx + hw * 0.5, cy - hh);
      ctx.lineTo(cx + hw * 0.9, cy - hh * 0.4); ctx.lineTo(cx + hw, cy + hh * 0.1);
      ctx.lineTo(cx + hw * 0.3, cy + hh * 0.4); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#ffaa33'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(cx - hw * 0.4, cy - hh * 0.6);
      ctx.lineTo(cx, cy + hh * 0.2); ctx.lineTo(cx + hw * 0.4, cy - hh * 0.6); ctx.stroke();
      ctx.fillStyle = '#ff9933'; ctx.beginPath();
      ctx.ellipse(cx, cy - hh * 0.2, hw * 0.2, hh * 0.25, 0, 0, Math.PI * 2); ctx.fill();
      const eGlow = 0.5 + 0.3 * Math.sin(this.phase * 2);
      ctx.fillStyle = `rgba(255,120,0,${eGlow})`; ctx.beginPath();
      ctx.arc(cx - hw * 0.3, cy - hh, 5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + hw * 0.3, cy - hh, 5, 0, Math.PI * 2); ctx.fill();
      if (this.hp < this.maxHp) {
        const bx = cx - this.w / 2, by = cy - hh - 10;
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(bx, by, this.w, 5);
        ctx.fillStyle = '#ff6633'; ctx.fillRect(bx, by, this.w * (this.hp / this.maxHp), 5);
      }
    } else if (this.type === 'titan') {
      // V4.3: 超大型耐打紫色巨舰
      // 主体（巨大紫色菱形）
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.moveTo(cx, cy - hh); ctx.lineTo(cx + hw, cy);
      ctx.lineTo(cx, cy + hh); ctx.lineTo(cx - hw, cy);
      ctx.closePath(); ctx.fill();
      // 内核发光
      const coreGlow = 0.4 + 0.3 * Math.sin(this.phase * 2);
      ctx.fillStyle = `rgba(255,200,50,${coreGlow})`;
      ctx.beginPath(); ctx.arc(cx, cy, hw * 0.25, 0, Math.PI * 2); ctx.fill();
      // 外部装甲纹路
      ctx.strokeStyle = `rgba(180,100,255,${0.3 + coreGlow})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, hw * 0.6, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, hw * 0.8, 0, Math.PI * 2); ctx.stroke();
      // 四角引擎火焰
      for (const off of [{x:-1,y:1},{x:1,y:1},{x:-1,y:-0.5},{x:1,y:-0.5}]) {
        const fx = cx + off.x * hw * 0.7, fy = cy + off.y * hh * 0.8;
        ctx.fillStyle = `rgba(255,100,0,${0.3 + 0.2 * Math.sin(this.phase * 4 + off.x)})`;
        ctx.beginPath(); ctx.arc(fx, fy, 5 + 2 * Math.sin(this.phase * 3), 0, Math.PI * 2); ctx.fill();
      }
      // 血条（超厚血条）
      if (this.hp < this.maxHp) {
        const bx = cx - this.w / 2, by = cy - hh - 12;
        ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(bx, by, this.w, 6);
        const pct = this.hp / this.maxHp;
        ctx.fillStyle = pct > 0.5 ? '#8800ff' : (pct > 0.25 ? '#ff8800' : '#ff3333');
        ctx.fillRect(bx, by, this.w * pct, 6);
        // 血量数字
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 9px Courier New'; ctx.textAlign = 'center';
        ctx.fillText(`${this.hp}/${this.maxHp}`, cx, by - 2);
      }
    }

    // 眩晕标记
    if (this.stunned) {
      ctx.fillStyle = 'rgba(100,150,255,0.4)'; ctx.beginPath();
      ctx.arc(cx, cy, hw + 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffff00'; ctx.font = '10px Courier New'; ctx.textAlign = 'center';
      const sp = frameCount * 0.1;
      for (let i = 0; i < 3; i++) {
        const sa = sp + i * Math.PI * 2 / 3;
        ctx.fillText('★', cx + Math.cos(sa) * (hw + 2), cy - hh - 4 + Math.sin(sa) * 5);
      }
    }
    ctx.restore();
  }

  getRect() { return { x: this.x - this.w / 2, y: this.y - this.h / 2, w: this.w, h: this.h }; }
}

let enemies = [];

// ==================== Boss 类 ====================

class Boss {
  constructor(stage) {
    this.id = ++enemyIdCounter; // V3: 唯一ID，用于等离子弹穿透标记
    this.stage = stage; this.w = CFG.bossWidth; this.h = CFG.bossHeight;
    this.x = W / 2; this.y = -this.h; this.targetY = 60;
    this.hp = Math.ceil((CFG.bossBaseHP + (stage - 1) * CFG.bossHPScale) * _diffBossHPMult);
    this.maxHp = this.hp; this.alive = true; this.phase = 0;
    this.entering = true; this.enraged = false; this.smokeTimer = 0;
    this.moveDir = 1; this.moveSpeed = CFG.bossSpeed;
    this.dashCooldown = 0; this.isDashing = false; this.dashTimer = 0; this.dashVx = 0;
    this.attackTimer = 0; this.attackPattern = 0; this.attackCooldown = 90;
    this.pendingAttacks = [];
    // V3: EMP眩晕
    this.stunned = false; this.stunTimer = 0;
    this.name = this._generateName(stage);
  }

  _generateName(stage) {
    const names = ['CRUISER α', 'DESTROYER β', 'WARSHIP γ', 'DREADNOUGHT δ', 'FORTRESS ε', 'LEVIATHAN ζ'];
    return names[Math.min(stage - 1, names.length - 1)] || `OVERLORD ${stage}`;
  }

  update() {
    // 眩晕状态不移动不攻击
    if (this.stunned) {
      this.stunTimer--;
      if (this.stunTimer <= 0) this.stunned = false;
      return;
    }
    this.phase += 0.04;
    // 入场动画
    if (this.entering) {
      this.y = lerp(this.y, this.targetY, 0.03);
      if (Math.abs(this.y - this.targetY) < 2) { this.y = this.targetY; this.entering = false; }
      return;
    }
    // 狂暴检测
    if (!this.enraged && this.hp / this.maxHp <= CFG.bossEnrageThreshold) {
      this.enraged = true;
      this.attackCooldown = Math.max(30, this.attackCooldown - 20);
      shakeFrames = 15; spawnExplosion(this.x, this.y, 20, '#ff4400');
    }
    // 移动
    if (this.isDashing) {
      this.x += this.dashVx; this.dashTimer--;
      if (this.dashTimer <= 0) { this.isDashing = false; this.dashCooldown = 180; }
    } else {
      this.x += this.moveDir * this.moveSpeed;
      if (this.x > W - this.w / 2 - 20) this.moveDir = -1;
      if (this.x < this.w / 2 + 20) this.moveDir = 1;
      if (this.dashCooldown > 0) { this.dashCooldown--; }
      else if (Math.random() < 0.005 * this.stage) {
        this.isDashing = true; this.dashTimer = 30;
        this.dashVx = (player.x - this.x) > 0 ? 6 : -6;
        if (this.enraged) this.dashVx *= 1.5;
      }
    }
    this.x = clamp(this.x, this.w / 2, W - this.w / 2);
    // 攻击
    this.attackTimer++;
    const cooldown = this.enraged ? this.attackCooldown * 0.6 : this.attackCooldown;
    if (this.attackTimer >= cooldown) { this.attackTimer = 0; this._performAttack(); }
    // 延迟攻击队列
    this.pendingAttacks = this.pendingAttacks.filter(a => {
      if (frameCount >= a.frame) { a.action(); return false; } return true;
    });
    // 受伤冒烟
    if (this.hp < this.maxHp * 0.7) {
      this.smokeTimer++;
      if (this.smokeTimer % 8 === 0) {
        particles.push(new Particle(this.x + rand(-this.w / 3, this.w / 3),
          this.y + rand(-this.h / 4, this.h / 4), rand(-0.5, 0.5), rand(-1, -0.3),
          randInt(15, 30), '#666666', rand(3, 6)));
      }
    }
  }

  _performAttack() {
    const patternCount = this.enraged ? 4 : 3;
    this.attackPattern = (this.attackPattern + 1) % patternCount;
    switch (this.attackPattern) {
      case 0: this._attackScatter(); break;
      case 1: this._attackHoming(); break;
      case 2: this._attackScatterWide(); break;
      case 3: this._attackLaser(); break;
      default: this._attackScatter(); break;
    }
  }

  _attackScatter() {
    const count = 5 + this.stage;
    const spreadAngle = Math.PI * 0.4;
    const startAngle = Math.PI / 2 - spreadAngle / 2;
    for (let i = 0; i < count; i++) {
      const angle = startAngle + (spreadAngle / (count - 1)) * i;
      const speed = 3 + this.stage * 0.2;
      bullets.push(new Bullet(this.x, this.y + this.h / 2, Math.cos(angle) * speed, Math.sin(angle) * speed, false, 1));
    }
  }

  _attackHoming() {
    const count = this.enraged ? 3 : 2;
    for (let i = 0; i < count; i++) {
      const tgt = nearestAlivePlayer(this.x, this.y) || player;
      const offsetX = (i - (count - 1) / 2) * 30;
      bossBullets.push(new HomingBullet(this.x + offsetX, this.y + this.h / 2,
        tgt.x, tgt.y, CFG.homingBulletSpeed + (this.enraged ? 0.5 : 0)));
    }
  }

  _attackScatterWide() {
    const count = 7 + this.stage;
    const spreadAngle = Math.PI * 0.6;
    const startAngle = Math.PI / 2 - spreadAngle / 2;
    for (let i = 0; i < count; i++) {
      const angle = startAngle + (spreadAngle / (count - 1)) * i;
      const speed = 2.5 + this.stage * 0.15;
      bullets.push(new Bullet(this.x, this.y + this.h / 2, Math.cos(angle) * speed, Math.sin(angle) * speed, false, 1));
    }
    if (this.enraged) {
      const _c = count, _sa = spreadAngle, _s = startAngle, _st = this.stage;
      const _x = this.x, _y = this.y + this.h / 2;
      this.pendingAttacks.push({
        frame: frameCount + 12,
        action: () => {
          for (let i = 0; i < _c; i++) {
            const angle = _s + (_sa / (_c - 1)) * i;
            const speed = 2 + _st * 0.1;
            bullets.push(new Bullet(_x, _y, Math.cos(angle) * speed, Math.sin(angle) * speed, false, 1));
          }
        }
      });
    }
  }

  _attackLaser() {
    laserWarnings.push(new LaserWarning(this, (nearestAlivePlayer(this.x, this.y) || player).x));
  }

  takeDamage(dmg) {
    this.hp -= dmg;
    audio.playMetalHit();
    spawnBossSpark(this.x + rand(-this.w / 3, this.w / 3), this.y + rand(-this.h / 4, this.h / 4));
    if (this.hp <= 0) { this.hp = 0; this.alive = false; }
  }

  draw() {
    ctx.save();
    const cx = this.x, cy = this.y, hw = this.w / 2, hh = this.h / 2;
    // 眩晕闪烁
    if (this.stunned) ctx.globalAlpha = 0.3 + 0.3 * Math.sin(frameCount * 0.3);
    // 狂暴红色光晕
    if (this.enraged) {
      const glowA = 0.15 + 0.1 * Math.sin(this.phase * 3);
      ctx.fillStyle = `rgba(255,0,0,${glowA})`;
      ctx.beginPath(); ctx.arc(cx, cy, hw + 20, 0, Math.PI * 2); ctx.fill();
    }
    // 船体
    ctx.fillStyle = this.enraged ? '#880033' : '#661144';
    ctx.beginPath(); ctx.moveTo(cx, cy + hh);
    ctx.lineTo(cx + hw * 0.3, cy + hh * 0.9); ctx.lineTo(cx + hw * 0.8, cy + hh * 0.4);
    ctx.lineTo(cx + hw, cy - hh * 0.1); ctx.lineTo(cx + hw * 0.95, cy - hh * 0.5);
    ctx.lineTo(cx + hw * 0.6, cy - hh); ctx.lineTo(cx - hw * 0.6, cy - hh);
    ctx.lineTo(cx - hw * 0.95, cy - hh * 0.5); ctx.lineTo(cx - hw, cy - hh * 0.1);
    ctx.lineTo(cx - hw * 0.8, cy + hh * 0.4); ctx.lineTo(cx - hw * 0.3, cy + hh * 0.9);
    ctx.closePath(); ctx.fill();
    // 金色装甲线
    ctx.strokeStyle = '#cc9900'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx - hw * 0.85, cy - hh * 0.3); ctx.lineTo(cx + hw * 0.85, cy - hh * 0.3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - hw * 0.7, cy + hh * 0.1); ctx.lineTo(cx + hw * 0.7, cy + hh * 0.1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy - hh); ctx.lineTo(cx, cy + hh * 0.8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - hw * 0.3, cy - hh * 0.8); ctx.lineTo(cx - hw * 0.7, cy + hh * 0.3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + hw * 0.3, cy - hh * 0.8); ctx.lineTo(cx + hw * 0.7, cy + hh * 0.3); ctx.stroke();
    // 装甲板
    ctx.fillStyle = this.enraged ? '#993355' : '#772255';
    ctx.beginPath(); ctx.moveTo(cx - hw * 0.5, cy - hh * 0.7); ctx.lineTo(cx + hw * 0.5, cy - hh * 0.7);
    ctx.lineTo(cx + hw * 0.7, cy - hh * 0.3); ctx.lineTo(cx - hw * 0.7, cy - hh * 0.3); ctx.closePath(); ctx.fill();
    // 核心指挥舱
    const coreGlow = 0.6 + 0.3 * Math.sin(this.phase * 2);
    ctx.fillStyle = this.enraged ? `rgba(255,50,50,${coreGlow})` : `rgba(200,50,200,${coreGlow})`;
    ctx.beginPath(); ctx.ellipse(cx, cy - hh * 0.2, hw * 0.15, hh * 0.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(255,255,255,${coreGlow * 0.5})`;
    ctx.beginPath(); ctx.ellipse(cx, cy - hh * 0.2, hw * 0.08, hh * 0.1, 0, 0, Math.PI * 2); ctx.fill();
    // 引擎发光
    for (const ep of [-0.6, -0.3, 0, 0.3, 0.6]) {
      const eg = 0.5 + 0.4 * Math.sin(this.phase * 3 + ep * 5);
      ctx.fillStyle = this.enraged ? `rgba(255,100,0,${eg})` : `rgba(200,100,255,${eg})`;
      ctx.beginPath(); ctx.arc(cx + hw * ep, cy - hh, 5 + 2 * Math.sin(this.phase * 4 + ep), 0, Math.PI * 2); ctx.fill();
    }
    // 侧翼炮台
    ctx.fillStyle = '#cc8800';
    ctx.beginPath(); ctx.arc(cx - hw * 0.85, cy - hh * 0.1, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + hw * 0.85, cy - hh * 0.1, 6, 0, Math.PI * 2); ctx.fill();
    const cg = 0.5 + 0.3 * Math.sin(this.phase * 2);
    ctx.fillStyle = `rgba(255,200,50,${cg})`;
    ctx.beginPath(); ctx.arc(cx - hw * 0.85, cy - hh * 0.1, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + hw * 0.85, cy - hh * 0.1, 3, 0, Math.PI * 2); ctx.fill();
    // 眩晕标记
    if (this.stunned) {
      ctx.fillStyle = 'rgba(100,150,255,0.3)'; ctx.beginPath();
      ctx.arc(cx, cy, hw + 10, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  getRect() { return { x: this.x - this.w / 2, y: this.y - this.h / 2, w: this.w, h: this.h }; }
}

// ==================== 玩家类 ====================

class Player {
  constructor(idx = 0) {
    this.idx = idx; // 0=P1, 1=P2
    this.x = idx === 0 ? W / 2 - 40 : W / 2 + 40;
    this.y = H - 80;
    this.w = 40; this.h = 44;
    this.lives = CFG.playerInitLives;
    this.fireCooldown = idx * -5; // P2稍延迟开火，避免重叠
    this.invincible = 0;
    this.shield = 0; this.doubleFire = 0;
    this.fireBullets = 0; // V4.2.1: 火焰子弹剩余帧数
    this.drones = 0; // V4.3: 无人机数量（每架可释放1次）
    this.droneCooldown = 0; // V4.3: 无人机释放冷却
    this.alive = true; this.phase = 0; this.thrustPhase = 0;
    // 双人模式各自独立的子弹
    this.bullets = [];
    // 各自的子弹等级
    this.bulletLevel = 1;
    this.shootCount = 0;
  }

  update() {
    if (!this.alive) return; // V4.2.1: 死亡后不再更新（不射击、不移动）
    this.phase += 0.06; this.thrustPhase += 0.15;
    if (this.invincible > 0) this.invincible--;
    if (this.shield > 0) this.shield--;
    if (this.doubleFire > 0) this.doubleFire--;
    if (this.fireBullets > 0) this.fireBullets--;
    if (this.droneCooldown > 0) this.droneCooldown--;

    let dx = 0, dy = 0;
    if (this.idx === 0) {
      // P1: WASD + 鼠标/触屏
      if (keys['KeyA']) dx = -1;
      if (keys['KeyD']) dx = 1;
      if (keys['KeyW']) dy = -1;
      if (keys['KeyS']) dy = 1;
      if (dx === 0 && dy === 0 && (mouseDown || touchActive)) {
        this.x = lerp(this.x, mouseX, 0.12); this.y = lerp(this.y, mouseY, 0.12);
        dx = 0; dy = 0; // 已处理移动
      }
    } else {
      // P2: 方向键
      if (keys['ArrowLeft']) dx = -1;
      if (keys['ArrowRight']) dx = 1;
      if (keys['ArrowUp']) dy = -1;
      if (keys['ArrowDown']) dy = 1;
    }
    if (dx !== 0 || dy !== 0) {
      const len = Math.sqrt(dx * dx + dy * dy);
      this.x += (dx / len) * CFG.playerSpeed; this.y += (dy / len) * CFG.playerSpeed;
    }
    this.x = clamp(this.x, this.w / 2, W - this.w / 2);
    this.y = clamp(this.y, this.h / 2, H - this.h / 2);

    // 射击
    this.fireCooldown--;
    if (this.fireCooldown <= 0) { this.fireCooldown = CFG.playerFireRate; this.shoot(); }

    // V3: 导弹冷却
    if (missileCooldownTimer > 0) missileCooldownTimer--;

    // V3: 等离子炮 — 自动发射
    if (unlockedWeapons.includes('plasmaCannon')) {
      if (plasmaCooldown > 0) plasmaCooldown--;
      if (plasmaCooldown <= 0) {
        const cdFrames = Math.max(180, 300 - (weaponLevel - 1) * 30);
        plasmaCooldown = cdFrames;
        plasmaBullets.push(new PlasmaBullet(this.x, this.y - this.h / 2 - 4));
        audio.playShoot();
      }
    }

    // V3: EMP释放
    if (unlockedWeapons.includes('emp') && keys['KeyC'] && empCharge >= CFG.empChargeKills && !empActive) {
      this.releaseEMP();
    }
    // V4.3: 释放无人机（按U键）
    if (keys['KeyU'] && this.drones > 0 && this.droneCooldown <= 0) {
      this.droneCooldown = 30; // 0.5秒冷却，防止连按
      this.drones--;
      deployDrone(this.x, this.y);
      audio.playPowerUp();
    }
  }

  shoot() {
    const bx = this.x, by = this.y - this.h / 2 - 4;
    // 有效子弹等级 = bulletLevel + (doubleFire激活时临时+1)
    const effectiveLevel = Math.min(this.bulletLevel + (this.doubleFire > 0 ? 1 : 0), CFG.bulletLevelMax);

    // 根据有效等级决定子弹排列和伤害
    switch (effectiveLevel) {
      case 1:
        bullets.push(new Bullet(bx, by, 0, -CFG.playerBulletSpeed, true, 1, this.idx));
        break;
      case 2:
        bullets.push(new Bullet(bx - 10, by, 0, -CFG.playerBulletSpeed, true, 1, this.idx));
        bullets.push(new Bullet(bx + 10, by, 0, -CFG.playerBulletSpeed, true, 1, this.idx));
        break;
      case 3:
        bullets.push(new Bullet(bx, by, 0, -CFG.playerBulletSpeed, true, 2, this.idx));
        bullets.push(new Bullet(bx - 14, by + 4, -CFG.playerBulletSpeed * 0.15, -CFG.playerBulletSpeed, true, 2, this.idx));
        bullets.push(new Bullet(bx + 14, by + 4, CFG.playerBulletSpeed * 0.15, -CFG.playerBulletSpeed, true, 2, this.idx));
        break;
      case 4:
        bullets.push(new Bullet(bx, by, 0, -CFG.playerBulletSpeed, true, 2, this.idx));
        bullets.push(new Bullet(bx - 12, by + 3, -CFG.playerBulletSpeed * 0.12, -CFG.playerBulletSpeed, true, 2, this.idx));
        bullets.push(new Bullet(bx + 12, by + 3, CFG.playerBulletSpeed * 0.12, -CFG.playerBulletSpeed, true, 2, this.idx));
        bullets.push(new Bullet(bx - 22, by + 8, -CFG.playerBulletSpeed * 0.4, -CFG.playerBulletSpeed * 0.9, true, 2, this.idx));
        bullets.push(new Bullet(bx + 22, by + 8, CFG.playerBulletSpeed * 0.4, -CFG.playerBulletSpeed * 0.9, true, 2, this.idx));
        break;
      case 5:
      default:
        bullets.push(new Bullet(bx, by, 0, -CFG.playerBulletSpeed, true, 3, this.idx));
        bullets.push(new Bullet(bx - 10, by + 2, -CFG.playerBulletSpeed * 0.12, -CFG.playerBulletSpeed, true, 3, this.idx));
        bullets.push(new Bullet(bx + 10, by + 2, CFG.playerBulletSpeed * 0.12, -CFG.playerBulletSpeed, true, 3, this.idx));
        bullets.push(new Bullet(bx - 20, by + 6, -CFG.playerBulletSpeed * 0.3, -CFG.playerBulletSpeed * 0.95, true, 3, this.idx));
        bullets.push(new Bullet(bx + 20, by + 6, CFG.playerBulletSpeed * 0.3, -CFG.playerBulletSpeed * 0.95, true, 3, this.idx));
        break;
    }

    // V4.2.1: 火焰子弹 — 额外发射火焰弹（穿透+燃烧）
    if (this.fireBullets > 0) {
      bullets.push(new Bullet(bx, by + 6, 0, -CFG.playerBulletSpeed * 1.3, true, 2, this.idx, true));
    }

    // V3: 自动发射导弹 — 每N次射击且有弹药时发射
    this.shootCount++;
    if (missileAmmo > 0 && this.shootCount >= CFG.missileFireEvery && missileCooldownTimer <= 0) {
      this.shootCount = 0;
      this.fireMissile();
    }

    // V3: 侧翼炮
    if (unlockedWeapons.includes('sideCannon')) {
      sideCannonCounter++;
      const triggerEvery = Math.max(1, 3 - Math.floor((weaponLevel - 1) / 2));
      if (sideCannonCounter >= triggerEvery) {
        sideCannonCounter = 0;
        const dmg = 1 + Math.floor((weaponLevel - 1) / 2);
        bullets.push(new Bullet(bx - this.w / 2 - 2, by + 5, -CFG.playerBulletSpeed * 0.7, -CFG.playerBulletSpeed * 0.7, true, dmg, this.idx));
        bullets.push(new Bullet(bx + this.w / 2 + 2, by + 5, CFG.playerBulletSpeed * 0.7, -CFG.playerBulletSpeed * 0.7, true, dmg, this.idx));
      }
    }
  }

  fireMissile() {
    missileAmmo--; missileCooldownTimer = CFG.missileCooldown;
    // 寻找最强目标
    let target = null;
    if (bossActive && currentBoss && currentBoss.alive) target = currentBoss;
    if (!target) {
      let bestPriority = -1;
      for (const e of enemies) {
        if (!e.alive) continue;
        let priority = (e.type === 'large' || e.type === 'bomber') ? 2 : 1;
        if (priority > bestPriority) { bestPriority = priority; target = e; }
      }
    }
    missiles.push(new Missile(this.x, this.y - this.h / 2 - 4, target));
    audio.playMissile();
  }

  releaseEMP() {
    empCharge = 0; empActive = true; empTimer = CFG.empStunDuration; empWaveRadius = 0;
    audio.playEMP();
    for (const e of enemies) {
      if (e.alive) { e.stunned = true; e.stunTimer = CFG.empStunDuration; }
    }
    if (bossActive && currentBoss && currentBoss.alive) {
      currentBoss.stunned = true; currentBoss.stunTimer = CFG.empStunDuration;
    }
  }

  draw() {
    ctx.save();
    const cx = this.x, cy = this.y, hw = this.w / 2, hh = this.h / 2;
    const p2 = this.idx === 1; // V4: P2橙色系
    if (this.invincible > 0 && Math.floor(this.invincible / 4) % 2 === 0) ctx.globalAlpha = 0.4;

    // 引擎尾焰
    const flameLen = 12 + 6 * Math.sin(this.thrustPhase);
    const flameGrd = ctx.createLinearGradient(cx, cy + hh, cx, cy + hh + flameLen);
    flameGrd.addColorStop(0, p2 ? 'rgba(255,150,0,0.9)' : 'rgba(0,200,255,0.9)');
    flameGrd.addColorStop(0.4, p2 ? 'rgba(255,100,0,0.6)' : 'rgba(100,180,255,0.6)');
    flameGrd.addColorStop(1, p2 ? 'rgba(255,50,0,0)' : 'rgba(0,50,255,0)');
    ctx.fillStyle = flameGrd;
    ctx.beginPath(); ctx.moveTo(cx - 6, cy + hh); ctx.lineTo(cx, cy + hh + flameLen);
    ctx.lineTo(cx + 6, cy + hh); ctx.closePath(); ctx.fill();
    const sf = 8 + 4 * Math.sin(this.thrustPhase + 1);
    ctx.fillStyle = flameGrd;
    ctx.beginPath(); ctx.moveTo(cx - 14, cy + hh * 0.5); ctx.lineTo(cx - 12, cy + hh * 0.5 + sf);
    ctx.lineTo(cx - 10, cy + hh * 0.5); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + 14, cy + hh * 0.5); ctx.lineTo(cx + 12, cy + hh * 0.5 + sf);
    ctx.lineTo(cx + 10, cy + hh * 0.5); ctx.closePath(); ctx.fill();

    // 机身
    ctx.fillStyle = p2 ? '#4a2a1a' : '#1a3a6a';
    ctx.beginPath(); ctx.moveTo(cx, cy - hh); ctx.lineTo(cx + 6, cy - hh * 0.6);
    ctx.lineTo(cx + hw * 0.5, cy - hh * 0.2); ctx.lineTo(cx + hw, cy + hh * 0.2);
    ctx.lineTo(cx + hw * 0.6, cy + hh * 0.5); ctx.lineTo(cx + 8, cy + hh);
    ctx.lineTo(cx - 8, cy + hh); ctx.lineTo(cx - hw * 0.6, cy + hh * 0.5);
    ctx.lineTo(cx - hw, cy + hh * 0.2); ctx.lineTo(cx - hw * 0.5, cy - hh * 0.2);
    ctx.lineTo(cx - 6, cy - hh * 0.6); ctx.closePath(); ctx.fill();

    ctx.fillStyle = p2 ? '#6a4a2a' : '#2a5a9a';
    ctx.beginPath(); ctx.moveTo(cx, cy - hh); ctx.lineTo(cx + 4, cy - hh * 0.4);
    ctx.lineTo(cx + 3, cy + hh * 0.5); ctx.lineTo(cx - 3, cy + hh * 0.5);
    ctx.lineTo(cx - 4, cy - hh * 0.4); ctx.closePath(); ctx.fill();

    // 驾驶舱
    ctx.fillStyle = p2 ? `rgba(255,150,0,${0.6 + 0.2 * Math.sin(this.phase)})` : `rgba(0,255,255,${0.6 + 0.2 * Math.sin(this.phase)})`;
    ctx.beginPath(); ctx.ellipse(cx, cy - hh * 0.25, 4, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(cx, cy - hh * 0.3, 2, 3, 0, 0, Math.PI * 2); ctx.fill();

    // 翼灯
    const wingGlow = 0.5 + 0.5 * Math.sin(this.phase * 2);
    ctx.fillStyle = p2 ? `rgba(255,150,0,${wingGlow})` : `rgba(0,255,200,${wingGlow})`;
    ctx.beginPath(); ctx.arc(cx - hw * 0.7, cy + hh * 0.15, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + hw * 0.7, cy + hh * 0.15, 2.5, 0, Math.PI * 2); ctx.fill();

    // V3: 侧翼炮 — 翼尖小炮管
    if (unlockedWeapons.includes('sideCannon')) {
      ctx.fillStyle = '#00cccc';
      ctx.beginPath(); ctx.moveTo(cx - hw - 2, cy + hh * 0.1); ctx.lineTo(cx - hw - 4, cy - hh * 0.3);
      ctx.lineTo(cx - hw + 2, cy - hh * 0.3); ctx.lineTo(cx - hw, cy + hh * 0.1); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx + hw + 2, cy + hh * 0.1); ctx.lineTo(cx + hw + 4, cy - hh * 0.3);
      ctx.lineTo(cx + hw - 2, cy - hh * 0.3); ctx.lineTo(cx + hw, cy + hh * 0.1); ctx.closePath(); ctx.fill();
      const cannonGlow = 0.5 + 0.5 * Math.sin(this.phase * 3);
      ctx.fillStyle = `rgba(0,255,255,${cannonGlow})`;
      ctx.beginPath(); ctx.arc(cx - hw - 1, cy - hh * 0.3, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + hw + 1, cy - hh * 0.3, 2, 0, Math.PI * 2); ctx.fill();
    }

    // V3: 等离子炮 — 机身顶部装置
    if (unlockedWeapons.includes('plasmaCannon')) {
      ctx.fillStyle = '#88aaff';
      ctx.beginPath(); ctx.arc(cx, cy - hh - 2, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(200,220,255,${0.5 + 0.5 * Math.sin(this.phase * 2)})`;
      ctx.beginPath(); ctx.arc(cx, cy - hh - 2, 2, 0, Math.PI * 2); ctx.fill();
    }

    // V3: EMP装置 — 机身环形
    if (unlockedWeapons.includes('emp')) {
      const ea = empCharge >= CFG.empChargeKills ? 0.8 : 0.3;
      ctx.strokeStyle = `rgba(100,150,255,${ea})`; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx, cy, hw * 0.35, 0, Math.PI * 2); ctx.stroke();
      if (empCharge >= CFG.empChargeKills) {
        ctx.fillStyle = `rgba(100,150,255,${0.3 + 0.2 * Math.sin(this.phase * 3)})`;
        ctx.beginPath(); ctx.arc(cx, cy, hw * 0.35, 0, Math.PI * 2); ctx.fill();
      }
    }

    // 护盾
    if (this.shield > 0) {
      const sa = this.shield < 60 ? (this.shield / 60) * 0.5 : 0.5;
      ctx.strokeStyle = `rgba(68,170,255,${sa})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, hw + 8 + 2 * Math.sin(this.phase * 3), 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = `rgba(68,170,255,${sa * 0.15})`; ctx.fill();
    }

    // V3.6: 变形升级特效
    if (transformLevel > 0) {
      const tfGlow = 0.3 + 0.2 * Math.sin(this.phase * 2 + transformLevel);
      // 能量光环
      if (transformLevel >= 1) {
        ctx.strokeStyle = `rgba(0,200,255,${tfGlow})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(cx, cy, hw + 14 + 3 * Math.sin(this.phase * 2), 0, Math.PI * 2); ctx.stroke();
      }
      // 金色能量翼
      if (transformLevel >= 2) {
        const wingAlpha = 0.25 + 0.15 * Math.sin(this.phase * 1.5);
        ctx.fillStyle = `rgba(255,200,50,${wingAlpha})`;
        // 左翼
        ctx.beginPath();
        ctx.moveTo(cx - hw, cy - 5);
        ctx.lineTo(cx - hw - 18, cy - 18);
        ctx.lineTo(cx - hw - 12, cy + 2);
        ctx.closePath(); ctx.fill();
        // 右翼
        ctx.beginPath();
        ctx.moveTo(cx + hw, cy - 5);
        ctx.lineTo(cx + hw + 18, cy - 18);
        ctx.lineTo(cx + hw + 12, cy + 2);
        ctx.closePath(); ctx.fill();
      }
      // 终极形态：彩虹粒子尾迹 + 电弧
      if (transformLevel >= 3) {
        const arcAlpha = 0.4 + 0.3 * Math.sin(this.phase * 4);
        ctx.strokeStyle = `rgba(255,100,200,${arcAlpha})`; ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(cx - hw * 0.5, cy - hh);
        ctx.lineTo(cx + hw * 0.5, cy - hh - 10);
        ctx.stroke();
        ctx.strokeStyle = `rgba(100,255,150,${arcAlpha})`; ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(cx + hw * 0.3, cy + hh * 0.5);
        ctx.lineTo(cx - hw * 0.3, cy + hh * 0.5 + 8);
        ctx.stroke();
      }
    }
    // 变形瞬间闪光
    if (transformFlash > 0) {
      const flashAlpha = Math.min(1, transformFlash / 30) * 0.6;
      ctx.fillStyle = `rgba(255,255,200,${flashAlpha})`;
      ctx.beginPath(); ctx.arc(cx, cy, hw + 25, 0, Math.PI * 2); ctx.fill();
      transformFlash--;
    }

    ctx.restore();
  }

  getRect() { return { x: this.x - this.w / 2 + 4, y: this.y - this.h / 2 + 4, w: this.w - 8, h: this.h - 8 }; }

  hit() {
    if (this.invincible > 0) return;
    if (this.shield > 0) { this.shield = 0; this.invincible = 30; shakeFrames = 6; audio.playPlayerHit(); return; }
    this.lives--; this.invincible = CFG.playerInvincibleFrames; shakeFrames = 10;
    spawnExplosion(this.x, this.y, 8, '#00ccff'); audio.playPlayerHit();
    if (this.lives <= 0) { this.alive = false; spawnExplosion(this.x, this.y, 30, '#00ccff'); audio.playGameOver(); }
  }
}

let player = new Player(0);
let player2 = null; // V4: 双人模式时的P2

// ==================== 敌机生成 ====================

let spawnTimer = 0;
let formationIdCounter = 0;

function spawnEnemy() {
  const r = Math.random();
  let type;

  // V3.3: 动态概率表 — 基于bossesDefeated解锁新敌机类型
  const normalChance = 0.15;
  const fastChance = 0.12;
  const zigzagChance = 0.12;
  const bomberChance = 0.10;
  const stealthChance = difficulty > 1 ? 0.08 : 0;
  const formationChance = difficulty > 0.5 ? 0.08 : 0;
  const largeChance = 0.12;
  // V3.3: Boss击败后解锁的新敌机概率
  const splitterChance = bossesDefeated >= 1 ? 0.07 : 0;
  const chargerChance = bossesDefeated >= 2 ? 0.07 : 0;
  const shielderChance = bossesDefeated >= 3 ? 0.05 : 0;
  const swarmChance = bossesDefeated >= 4 ? 0.06 : 0;
  const eliteChance = bossesDefeated >= 5 ? 0.04 : 0;
  // V4.3: 第8关后出现超大型耐打敌机
  const titanChance = currentStage >= 8 ? 0.03 : 0;
  // V4.4: 不可消灭的幽灵障碍机（第3关后出现，概率随关卡递增）
  const ghostChance = currentStage >= 3 ? Math.min(0.06, 0.02 + (currentStage - 3) * 0.005) : 0;

  // 构建概率表
  const pool = [
    { type: 'normal', chance: normalChance },
    { type: 'fast', chance: fastChance },
    { type: 'zigzag', chance: zigzagChance },
    { type: 'bomber', chance: bomberChance },
    { type: 'stealth', chance: stealthChance },
    { type: 'formation', chance: formationChance },
    { type: 'large', chance: largeChance },
    { type: 'splitter', chance: splitterChance },
    { type: 'charger', chance: chargerChance },
    { type: 'shielder', chance: shielderChance },
    { type: 'swarm', chance: swarmChance },
    { type: 'elite', chance: eliteChance },
    { type: 'titan', chance: titanChance },
    { type: 'ghost', chance: ghostChance },
  ].filter(p => p.chance > 0);

  // 计算已分配概率，剩余补给normal
  const totalAllocated = pool.reduce((s, p) => s + p.chance, 0);
  const normalPoolIdx = pool.findIndex(p => p.type === 'normal');
  if (normalPoolIdx >= 0) pool[normalPoolIdx].chance += (1 - totalAllocated);

  // 轮盘选择
  let cum = 0;
  type = 'normal';
  for (const p of pool) {
    cum += p.chance;
    if (r < cum) { type = p.type; break; }
  }

  if (type === 'formation') {
    // 编队：一次生成3架V字编队
    const formId = ++formationIdCounter;
    const cfg = CFG.enemies.formation;
    const baseX = rand(cfg.w + 30, W - cfg.w - 30);
    for (let i = 0; i < 3; i++) {
      const offsets = [0, -25, 25];
      const e = new Enemy('formation', baseX + offsets[i], -cfg.h - (i > 0 ? 15 : 0));
      e.formationId = formId; e.formationIndex = i; e.formationLeaderX = baseX;
      enemies.push(e);
    }
  } else if (type === 'swarm') {
    // 蜂群：一次生成3-5架小机
    const cfg = CFG.enemies.swarm;
    const count = randInt(3, 5);
    const baseX = rand(cfg.w + 30, W - cfg.w - 30);
    for (let i = 0; i < count; i++) {
      const sx = baseX + rand(-60, 60);
      const sy = -cfg.h - rand(0, 40);
      enemies.push(new Enemy('swarm', clamp(sx, cfg.w / 2 + 5, W - cfg.w / 2 - 5), sy));
    }
  } else {
    const cfg = CFG.enemies[type];
    const x = rand(cfg.w / 2 + 10, W - cfg.w / 2 - 10);
    enemies.push(new Enemy(type, x, -cfg.h));
  }
}

/** V3: 编队散开（一架被击毁后其余加速散开） */
function scatterFormation(formationId) {
  for (const e of enemies) {
    if (e.formationId === formationId && e.alive && !e.formationScattered) {
      e.formationScattered = true;
      e.scatterVx = e.formationIndex === 1 ? -3 : (e.formationIndex === 2 ? 3 : (Math.random() > 0.5 ? 2 : -2));
    }
  }
}

/** V3: 敌机被击杀处理（通用） */
function onEnemyKilled(e) {
  e.alive = false;
  combo++; comboTimer = CFG.comboTimeout;
  const comboBonus = Math.floor(e.score * (1 + combo * 0.1) * _diffScoreMult);
  score += comboBonus;
  stageKillCount++; totalKillCount++;

  // EMP蓄力
  if (unlockedWeapons.includes('emp')) {
    empCharge = Math.min(empCharge + 1, CFG.empChargeKills);
  }
  spawnExplosion(e.x, e.y, CFG.explosionParticles + (e.type === 'large' || e.type === 'bomber' ? 15 : 0), e.color);
  audio.playExplosion();

  // 编队散开
  if (e.type === 'formation' && e.formationId) {
    scatterFormation(e.formationId);
  }

  // V3.3: 分裂机被击毁后分裂成2架fast小机
  if (e.type === 'splitter') {
    for (let side = -1; side <= 1; side += 2) {
      const child = new Enemy('fast', e.x + side * 20, e.y);
      child.speed = e.speed * 1.3;
      enemies.push(child);
    }
  }

  // 道具掉落 — bomber和large有更高概率掉落missile和power
  const isBomberOrLarge = e.type === 'bomber' || e.type === 'large';
  const dropChance = isBomberOrLarge ? 0.25 : CFG.powerUpChance;
  if (Math.random() < dropChance) {
    // bomber/large有更高概率掉missile道具和power道具
    let dropType;
    if (isBomberOrLarge && Math.random() < 0.4) {
      dropType = 'missile';
    } else if (isBomberOrLarge && Math.random() < 0.3) {
      dropType = 'power';
    } else if (Math.random() < 0.15) {
      // 普通敌机也有小概率掉power
      dropType = 'power';
    } else if (Math.random() < 0.12) {
      // V4.2.1: 随机掉火焰子弹道具
      dropType = 'fire';
    } else {
      dropType = POWERUP_TYPES[randInt(0, POWERUP_TYPES.length - 1)];
    }
    powerUps.push(new PowerUp(e.x, e.y, dropType));
  }
}

function drawHUD() {
  ctx.save();
  // 分数
  ctx.fillStyle = '#00ffff'; ctx.font = 'bold 20px Courier New'; ctx.textAlign = 'left';
  ctx.fillText(`SCORE ${score.toString().padStart(7, '0')}`, 12, 30);
  // 关卡 + 难度
  const dc = DIFFICULTY_CONFIG[difficultyMode];
  ctx.fillStyle = dc.color; ctx.font = 'bold 14px Courier New';
  ctx.fillText(`STAGE ${currentStage}`, 12, 48);
  ctx.fillStyle = 'rgba(0,255,255,0.4)'; ctx.font = '12px Courier New';
  ctx.fillText(`HI ${hiScore.toString().padStart(7, '0')}`, 120, 48);
  ctx.fillStyle = dc.color; ctx.font = '11px Courier New';
  ctx.fillText(`[${dc.name}]`, 12, 62);
  // V4: 模式标识
  if (gameMode === 1) {
    ctx.fillStyle = '#ff8800'; ctx.font = '11px Courier New';
    ctx.fillText('[双人]', 70, 62);
  }
  // P1生命值
  ctx.fillStyle = '#00ff88'; ctx.textAlign = 'right';
  for (let i = 0; i < player.lives; i++) {
    ctx.beginPath();
    ctx.moveTo(W - 20 - i * 22, 18); ctx.lineTo(W - 26 - i * 22, 28); ctx.lineTo(W - 14 - i * 22, 28);
    ctx.closePath(); ctx.fill();
  }
  // V4: P2生命值（橙色三角）
  if (player2) {
    ctx.fillStyle = '#ff8800';
    for (let i = 0; i < player2.lives; i++) {
      ctx.beginPath();
      ctx.moveTo(W - 20 - i * 22, 38); ctx.lineTo(W - 26 - i * 22, 48); ctx.lineTo(W - 14 - i * 22, 48);
      ctx.closePath(); ctx.fill();
    }
    // P1/P2 标签
    ctx.font = '10px Courier New'; ctx.textAlign = 'right';
    ctx.fillStyle = '#00ff88'; ctx.fillText('P1', W - 20 - player.lives * 22 - 4, 28);
    ctx.fillStyle = '#ff8800'; ctx.fillText('P2', W - 20 - player2.lives * 22 - 4, 48);
  }
  // 连击
  if (combo > 1) {
    const ca = Math.min(1, comboTimer / 30);
    ctx.fillStyle = `rgba(255,200,0,${ca})`; ctx.font = `bold ${16 + combo * 2}px Courier New`;
    ctx.textAlign = 'center'; ctx.fillText(`${combo}x COMBO`, W / 2, 34);

  // 道具状态
  let statusY = 66;

    ctx.fillStyle = '#44aaff'; ctx.font = '12px Courier New'; ctx.textAlign = 'left';
    ctx.fillText(`P1 SHIELD ${Math.ceil(player.shield / 60)}s`, 12, statusY); statusY += 16;
  }
  if (player.doubleFire > 0) {
    ctx.fillStyle = '#ffaa00'; ctx.font = '12px Courier New'; ctx.textAlign = 'left';
    const effectiveLevel = Math.min(player.bulletLevel + 1, CFG.bulletLevelMax);
    ctx.fillText(`P1 DOUBLE ${Math.ceil(player.doubleFire / 60)}s (LV${effectiveLevel})`, 12, statusY); statusY += 16;
  }
  // V4.2.1: 火焰子弹状态
  if (player.fireBullets > 0) {
    ctx.fillStyle = '#ff4400'; ctx.font = 'bold 12px Courier New'; ctx.textAlign = 'left';
    ctx.fillText(`🔥 FIRE ${Math.ceil(player.fireBullets / 60)}s`, 12, statusY); statusY += 16;
  }
  // V4.3: 无人机数量
  if (player.drones > 0) {

    ctx.fillText(`UAV x${player.drones} [U]`, 12, statusY); statusY += 16;
  }
  // 子弹等级显示
  const lvColor = player.bulletLevel >= 5 ? '#ff4400' : (player.bulletLevel >= 3 ? '#ffaa00' : '#ffdd00');
  ctx.fillStyle = lvColor; ctx.font = 'bold 12px Courier New'; ctx.textAlign = 'left';
  ctx.fillText(`P1 LV${player.bulletLevel}`, 12, statusY); statusY += 16;

  // V4: P2道具状态
  if (player2) {
    if (player2.shield > 0) {
      ctx.fillStyle = '#ff8844'; ctx.font = '12px Courier New'; ctx.textAlign = 'left';
      ctx.fillText(`P2 SHIELD ${Math.ceil(player2.shield / 60)}s`, 12, statusY); statusY += 16;
    }
    if (player2.doubleFire > 0) {
      ctx.fillStyle = '#ff8800'; ctx.font = '12px Courier New'; ctx.textAlign = 'left';
      const p2eff = Math.min(player2.bulletLevel + 1, CFG.bulletLevelMax);
      ctx.fillText(`P2 DOUBLE ${Math.ceil(player2.doubleFire / 60)}s (LV${p2eff})`, 12, statusY); statusY += 16;
    }

      ctx.fillStyle = '#ff4400'; ctx.font = 'bold 12px Courier New'; ctx.textAlign = 'left';
      ctx.fillText(`🔥 P2 FIRE ${Math.ceil(player2.fireBullets / 60)}s`, 12, statusY); statusY += 16;
    }
    // V4.3: P2无人机数量
    if (player2.drones > 0) {
      ctx.fillStyle = '#00ff88'; ctx.font = 'bold 12px Courier New'; ctx.textAlign = 'left';
      ctx.fillText(`P2 UAV x${player2.drones} [U]`, 12, statusY); statusY += 16;
    }
    const p2LvColor = player2.bulletLevel >= 5 ? '#ff4400' : (player2.bulletLevel >= 3 ? '#ff8800' : '#ffaa44');
    ctx.fillStyle = p2LvColor; ctx.font = 'bold 12px Courier New'; ctx.textAlign = 'left';
    ctx.fillText(`P2 LV${player2.bulletLevel}`, 12, statusY); statusY += 16;
  }

  // V3: 导弹数量（HUD右侧，自动发射）
  if (missileAmmo > 0) {
    ctx.fillStyle = '#ff3333'; ctx.font = 'bold 14px Courier New'; ctx.textAlign = 'right';
    ctx.fillText(`MISSILE x${missileAmmo}`, W - 12, 50);
  }

  // V3: 已解锁武器图标（左下角）
  for (let i = 0; i < unlockedWeapons.length; i++) {
    drawWeaponIcon(16 + i * 28, H - 20, unlockedWeapons[i]);
  }

  // V3: EMP蓄力条
  if (unlockedWeapons.includes('emp')) {
    const idx = unlockedWeapons.indexOf('emp');
    const barX = 16 + idx * 28, barY = H - 36;
    const chargeRatio = empCharge / CFG.empChargeKills;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(barX - 2, barY, 24, 6);
    ctx.fillStyle = chargeRatio >= 1 ? '#44aaff' : '#335577';
    ctx.fillRect(barX, barY + 1, 20 * chargeRatio, 4);
    if (chargeRatio >= 1) {
      ctx.fillStyle = `rgba(100,200,255,${0.3 + 0.2 * Math.sin(frameCount * 0.1)})`;
      ctx.fillRect(barX, barY + 1, 20, 4);
    }
  }

  // V3: 当前挂载武器名称
  if (unlockedWeapons.length > 0) {
    ctx.fillStyle = 'rgba(200,220,255,0.5)'; ctx.font = '10px Courier New'; ctx.textAlign = 'left';
    ctx.fillText(getWeaponDisplayName(unlockedWeapons[unlockedWeapons.length - 1]), 14, H - 4);
  }

  // Boss血条
  if (bossActive && currentBoss && currentBoss.alive) drawBossHPBar();
  ctx.restore();
}

/** 绘制武器小图标 */
function drawWeaponIcon(x, y, weaponName) {
  ctx.save();
  if (weaponName === 'sideCannon') {
    ctx.fillStyle = '#00cccc'; ctx.beginPath();
    ctx.moveTo(x, y - 8); ctx.lineTo(x - 6, y + 2); ctx.lineTo(x + 6, y + 2); ctx.closePath(); ctx.fill();
  } else if (weaponName === 'plasmaCannon') {
    ctx.fillStyle = '#88aaff'; ctx.fillRect(x - 3, y - 8, 6, 12);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 1, y - 6, 2, 8);
  } else if (weaponName === 'emp') {
    ctx.strokeStyle = '#4488ff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y - 3, 6, 0, Math.PI * 2); ctx.stroke();
    if (empCharge >= CFG.empChargeKills) {
      ctx.fillStyle = `rgba(68,136,255,${0.3 + 0.2 * Math.sin(frameCount * 0.1)})`;
      ctx.beginPath(); ctx.arc(x, y - 3, 6, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
}

function getWeaponDisplayName(weaponName) {
  return { sideCannon: 'SIDE CANNON', plasmaCannon: 'PLASMA', emp: 'EMP' }[weaponName] || weaponName.toUpperCase();
}

function drawBossHPBar() {
  const boss = currentBoss;
  const barW = W - 80, barH = 12, bx = 40, by = H - 30;
  const hpRatio = boss.hp / boss.maxHp;
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(bx - 2, by - 2, barW + 4, barH + 4);
  ctx.fillStyle = '#331111'; ctx.fillRect(bx, by, barW, barH);
  ctx.fillStyle = boss.enraged ? '#ff2200' : '#cc0066'; ctx.fillRect(bx, by, barW * hpRatio, barH);
  ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(bx, by, barW * hpRatio, barH / 2);
  ctx.fillStyle = boss.enraged ? '#ff4444' : '#ff66aa'; ctx.font = 'bold 12px Courier New';
  ctx.textAlign = 'center'; ctx.fillText(boss.name, W / 2, by - 6);
}

// ==================== 关卡界面绘制 ====================

let stageIntroPhase = 0;
let cachedBossName = '';

function drawStageIntro() {
  stageIntroPhase += 0.04;
  const progress = stageIntroTimer / CFG.stageIntroFrames;
  let alpha = 1;
  if (progress < 0.2) alpha = progress / 0.2;
  else if (progress > 0.8) alpha = (1 - progress) / 0.2;
  alpha = clamp(alpha, 0, 1);
  ctx.save(); ctx.fillStyle = `rgba(5,5,20,${alpha * 0.7})`; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.globalAlpha = alpha;
  ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 20;
  ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 52px Courier New'; ctx.fillText('STAGE', W / 2, H * 0.38);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 72px Courier New'; ctx.fillText(`${currentStage}`, W / 2, H * 0.52);
  ctx.restore();
}

function drawBossWarning() {
  ctx.save();
  const pulse = 0.15 + 0.1 * Math.sin(bossWarningTimer * 0.15);
  ctx.fillStyle = `rgba(80,0,0,${pulse})`; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  if (Math.sin(bossWarningTimer * 0.2) > 0) {
    ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 30;
    ctx.fillStyle = '#ff0000'; ctx.font = 'bold 48px Courier New'; ctx.fillText('WARNING', W / 2, H * 0.35);
    ctx.shadowBlur = 0;
  }
  const a = 0.6 + 0.3 * Math.sin(bossWarningTimer * 0.1);
  ctx.fillStyle = `rgba(255,100,50,${a})`; ctx.font = 'bold 22px Courier New';
  ctx.fillText('BOSS APPROACHING', W / 2, H * 0.45);
  if (bossWarningTimer > 60) {
    if (!cachedBossName) cachedBossName = new Boss(currentStage).name;
    ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 16px Courier New';
    ctx.fillText(cachedBossName, W / 2, H * 0.55);
  }
  ctx.restore();

/** V4: 菜单点击处理 — 模式选择+难度选择+开始按钮 */
function handleMenuClick(mx, my) {
  // V4: 检测模式按钮点击
  const mBtnW = 140, mBtnH = 55, mBtnGap = 30;
  const mTotalW = 2 * mBtnW + mBtnGap;
  const mStartX = W / 2 - mTotalW / 2;
  const modeY = H * 0.28;
  for (let i = 0; i < 2; i++) {
    const bx = mStartX + i * (mBtnW + mBtnGap), by = modeY;
    if (mx >= bx && mx <= bx + mBtnW && my >= by && my <= by + mBtnH) {
      gameMode = i;
      return 'select';
    }
  }

  // 检测难度按钮点击
  const btnW = 120, btnH = 60, btnGap = 20;
  const totalW = 3 * btnW + 2 * btnGap;
  const startX = W / 2 - totalW / 2;
  const diffY = H * 0.46;

  for (let i = 0; i < 3; i++) {
    const bx = startX + i * (btnW + btnGap), by = diffY;
    if (mx >= bx && mx <= bx + btnW && my >= by && my <= by + btnH) {
      difficultyMode = i;
      localStorage.setItem('planeWarDifficulty', difficultyMode.toString());
      return 'select';
    }
  }

  // 检测START按钮点击
  const btnY = H * 0.68;
  const pulse = 0.85 + 0.15 * Math.sin(menuPhase * 3);
  const startBtnW = 200 * pulse, startBtnH = 56 * pulse;
  if (mx >= W / 2 - startBtnW / 2 && mx <= W / 2 + startBtnW / 2 &&
      my >= btnY - startBtnH / 2 && my <= btnY + startBtnH / 2) {
    return 'start';
  }

  return null;
}

// ==================== 游戏核心逻辑 ====================

let starField = new StarField();

function resetGame() {
  score = 0; combo = 0; comboTimer = 0; frameCount = 0; difficulty = 0;
  shakeFrames = 0; spawnTimer = 0; gameOverTimer = 0;
  bullets = []; enemies = []; powerUps = []; particles = [];
  bossBullets = []; laserWarnings = [];
  missiles = []; bombs = []; explosions = []; plasmaBullets = [];
  player = new Player(0);
  player2 = gameMode === 1 ? new Player(1) : null; // V4: 双人模式创建P2
  currentStage = 1; stageTimer = 0; stageIntroTimer = 0;
  bossWarningTimer = 0; bossDefeatedTimer = 0;
  bossActive = false; currentBoss = null;
  stageKillCount = 0; totalKillCount = 0;
  killStreak = 0; killStreakFlash = 0; // V4.2: 击杀计数重置
  // V3: 重置导弹
  missileAmmo = 0; missileCooldownTimer = 0;
  // V3: 重置子弹升级（V4: 每个Player有自己的bulletLevel）
  bulletLevel = 1; shootCount = 0;
  // V3: 重置武器系统（游戏结束重新开始则重置）
  unlockedWeapons = []; weaponUnlockName = ''; bossesDefeated = 0; newEnemyUnlockName = '';
  sideCannonCounter = 0; plasmaCooldown = 0;
  empCharge = 0; empActive = false; empTimer = 0; empWaveRadius = 0;
  weaponLevel = 1;
  // V3.6: 变形系统重置
  transformLevel = 0; transformFlash = 0; transformAnnounce = ''; pendingTransform = false; transformAnimTimer = 0;
  // 答题系统重置
  quizInput = ''; quizResult = 0; quizTimer = 0; quizWrongCount = 0;
  // 应用难度配置
  const dc = DIFFICULTY_CONFIG[difficultyMode];
  // 难度影响：敌机速度倍率 × 难度倍率 = 最终速度
  // 但由于CFG里敌机速度是写死的，我们通过额外乘数覆盖
  // 下面通过替换CFG的enemySpeedScale和spawnMult来实现
  _applyDifficulty(difficultyMode);
  gameState = STATE.STAGE_INTRO; stageIntroPhase = 0;
  audio.playStageStart();
}

/** 根据难度模式调整游戏参数 */
function _applyDifficulty(mode) {
  const dc = DIFFICULTY_CONFIG[mode];
  // 敌机速度倍率（乘到现有速度上）
  _diffEnemySpeedMult = dc.enemySpeedMult;
  // 敌机HP倍率
  _diffEnemyHPMult = dc.enemyHPMult;
  // 刷怪间隔倍率（越小越快）
  _diffSpawnMult = dc.spawnMult;
  // Boss HP倍率
  _diffBossHPMult = dc.bossHPMult;
  // 关卡时长倍率（越小越短）
  _diffStageMult = dc.stageMult;
  // 分数倍率
  _diffScoreMult = dc.scoreMult;
}

let _diffEnemySpeedMult = 1, _diffEnemyHPMult = 1, _diffSpawnMult = 1;
let _diffBossHPMult = 1, _diffStageMult = 1, _diffScoreMult = 1;

function updateGame() {
  frameCount++; difficulty = frameCount * 0.001;
  if (comboTimer > 0) { comboTimer--; if (comboTimer <= 0) combo = 0; }
  if (shakeFrames > 0) shakeFrames--;
  stageTimer++;

  if (!bossActive && stageTimer >= CFG.stageDuration * _diffStageMult && enemies.length === 0) {
    gameState = STATE.BOSS_WARNING; bossWarningTimer = 0; cachedBossName = '';
    audio.playBossWarning(); return;
  }

  if (stageTimer < CFG.stageDuration * _diffStageMult) {
    const baseInterval = Math.max(CFG.enemySpawnMin, Math.round((CFG.enemySpawnBase - difficulty * 30) * _diffSpawnMult));
    spawnTimer++;
    if (spawnTimer >= baseInterval) {
      spawnTimer = 0; spawnEnemy();
      if (difficulty > 2 && Math.random() < 0.3) spawnEnemy();
    }
  }
  updateEntities();
}

function updateEntities() {
  player.update();
  if (player2) player2.update();
  // V4: 同步全局bulletLevel到P1（供HUD/武器解锁使用）
  bulletLevel = player.bulletLevel;
  for (const b of bullets) b.update(); bullets = bullets.filter(b => b.alive);
  for (const e of enemies) e.update(); enemies = enemies.filter(e => e.alive);
  for (const p of powerUps) p.update(); powerUps = powerUps.filter(p => p.alive);
  for (const p of particles) p.update(); particles = particles.filter(p => p.life > 0);
  for (const b of bossBullets) b.update(); bossBullets = bossBullets.filter(b => b.alive);
  for (const l of laserWarnings) l.update(); laserWarnings = laserWarnings.filter(l => !l.done);
  for (const m of missiles) m.update(); missiles = missiles.filter(m => m.alive);
  for (const b of bombs) b.update(); bombs = bombs.filter(b => b.alive);
  for (const ex of explosions) { ex.timer--; ex.radius = lerp(ex.radius, ex.maxRadius, 0.15); }
  explosions = explosions.filter(ex => ex.timer > 0);
  for (const p of plasmaBullets) p.update(); plasmaBullets = plasmaBullets.filter(p => p.alive);
  // V4.3: 无人机冲击波更新
  updateDroneBlasts();
  if (empActive) {
    empTimer--; empWaveRadius = lerp(empWaveRadius, CFG.empRadius, 0.08);
    if (empTimer <= 0) { empActive = false; empWaveRadius = 0; }
  }

  checkCollisions();

  // V4: 双人模式 — 两个都死才算Game Over
  const allDead = !player.alive && (!player2 || !player2.alive);
  if (allDead) {
    gameState = STATE.GAMEOVER; gameOverTimer = 0;
    if (score > hiScore) { hiScore = score; localStorage.setItem('planeWarHi', hiScore.toString()); }
  }
}

/** 碰撞检测 */
function checkCollisions() {
  // 玩家子弹 vs 敌机
  for (const b of bullets) {
    if (!b.isPlayer || !b.alive) continue;
    for (const e of enemies) {
      if (!e.alive) continue;
      if (e.type === 'ghost') continue; // V4.4: 幽灵机不可被子弹消灭
      if (rectCollide(b.getRect(), e.getRect())) {
        // V4.2.1: 火焰子弹穿透，普通子弹消失
        if (!b.isFire) b.alive = false;
        e.hp -= b.damage; spawnSpark(b.x, b.y);
        // V4.2.1: 火焰子弹额外燃烧粒子
        if (b.isFire) {
          for (let i = 0; i < 5; i++) {
            particles.push(new Particle(e.x + rand(-10, 10), e.y + rand(-10, 10),
              rand(-2, 2), rand(-3, -1), randInt(10, 20),
              ['#ff3300', '#ff6600', '#ffcc00'][randInt(0, 2)], rand(3, 6)));
          }
        }
        if (e.hp <= 0) onEnemyKilled(e);
        if (!b.isFire) break; // 普通子弹只打一个
      }
    }
  }

  // 玩家子弹 vs Boss
  if (bossActive && currentBoss && currentBoss.alive) {
    for (const b of bullets) {
      if (!b.isPlayer || !b.alive) continue;
      if (rectCollide(b.getRect(), currentBoss.getRect())) {
        if (!b.isFire) b.alive = false;
        currentBoss.takeDamage(b.damage);
        if (b.isFire) {
          for (let i = 0; i < 5; i++) {
            particles.push(new Particle(currentBoss.x + rand(-20, 20), currentBoss.y + rand(-20, 20),
              rand(-2, 2), rand(-3, -1), randInt(10, 20),
              ['#ff3300', '#ff6600', '#ffcc00'][randInt(0, 2)], rand(3, 6)));
          }
        }
        if (!currentBoss.alive) { onBossDefeated(); break; }
      }
    }
  }

  // V3: 导弹 vs 敌机
  for (const m of missiles) {
    if (!m.alive) continue;
    for (const e of enemies) {
      if (!e.alive) continue;
      if (e.type === 'ghost') continue; // V4.4: 幽灵机不可被导弹消灭
      if (rectCollide(m.getRect(), e.getRect())) {
        m.alive = false;
        let dmg = 999; // 普通敌机一击必杀
        if (e.type === 'large' || e.type === 'bomber') dmg = CFG.missileDamageLarge;
        e.hp -= dmg;
        spawnMissileExplosion(m.x, m.y); audio.playMissileHit(); shakeFrames = 8;
        if (e.hp <= 0) onEnemyKilled(e);
        // 导弹范围伤害
        for (const e2 of enemies) {
          if (!e2.alive || e2 === e) continue;
          if (dist(m.x, m.y, e2.x, e2.y) < 50) {
            e2.hp -= 2;
            if (e2.hp <= 0) onEnemyKilled(e2);
          }
        }
        // 导弹范围伤害Boss
        if (bossActive && currentBoss && currentBoss.alive) {
          if (dist(m.x, m.y, currentBoss.x, currentBoss.y) < 80) {
            currentBoss.takeDamage(CFG.missileDamage);
            if (!currentBoss.alive) { onBossDefeated(); break; }
          }
        }
        break;
      }
    }
  }

  // V3: 导弹 vs Boss（如果没命中敌机）
  if (bossActive && currentBoss && currentBoss.alive) {
    for (const m of missiles) {
      if (!m.alive) continue;
      if (rectCollide(m.getRect(), currentBoss.getRect())) {
        m.alive = false;
        currentBoss.takeDamage(CFG.missileDamage);
        spawnMissileExplosion(m.x, m.y); audio.playMissileHit(); shakeFrames = 8;
        if (!currentBoss.alive) { onBossDefeated(); break; }
      }
    }
  }

  // V3: 等离子贯穿弹 vs 敌机（穿透）
  for (const p of plasmaBullets) {
    if (!p.alive) continue;
    for (const e of enemies) {
      if (!e.alive || p.pierced.has(e.id)) continue;
      if (e.type === 'ghost') continue; // V4.4: 幽灵机不可被等离子弹消灭
      if (rectCollide(p.getRect(), e.getRect())) {
        p.pierced.add(e.id); // 标记已穿透，不消失
        e.hp -= p.damage;
        spawnSpark(p.x, p.y);
        if (e.hp <= 0) onEnemyKilled(e);
      }
    }
    // 等离子 vs Boss（穿透）
    if (bossActive && currentBoss && currentBoss.alive && !p.pierced.has(currentBoss.id)) {
      if (rectCollide(p.getRect(), currentBoss.getRect())) {
        currentBoss.takeDamage(p.damage);
        p.pierced.add(currentBoss.id); // 标记Boss已穿透
        if (!currentBoss.alive) { onBossDefeated(); break; }
      }
    }
  }

  // 敌方子弹 vs 玩家（含P2）
  for (const p of [player, player2]) {
    if (!p || !p.alive || p.invincible > 0) continue;
    for (const b of bullets) {
      if (b.isPlayer || !b.alive) continue;
      if (rectCollide(b.getRect(), p.getRect())) { b.alive = false; p.hit(); break; }
    }
  }

  // Boss追踪弹 vs 玩家（含P2）
  for (const p of [player, player2]) {
    if (!p || !p.alive || p.invincible > 0) continue;
    for (const b of bossBullets) {
      if (!b.alive) continue;
      if (rectCollide(b.getRect(), p.getRect())) { b.alive = false; p.hit(); break; }
    }
  }

  // Boss激光 vs 玩家（含P2）
  for (const l of laserWarnings) {
    if (player.alive && l.hitsPlayer(player)) player.hit();
    if (player2 && player2.alive && l.hitsPlayer(player2)) player2.hit();
  }

  // 敌机撞击玩家（含P2）
  for (const p of [player, player2]) {
    if (!p || !p.alive || p.invincible > 0) continue;
    for (const e of enemies) {
      if (!e.alive) continue;
      if (rectCollide(e.getRect(), p.getRect())) {
        if (e.type === 'ghost') {
          // V4.4: 幽灵机撞击玩家后不死，继续飞行
          p.hit(); break;
        }
        e.alive = false; spawnExplosion(e.x, e.y, CFG.explosionParticles, e.color);
        audio.playExplosion(); p.hit(); break;
      }
    }
  }

  // V3: 爆炸圈 vs 玩家（含P2）
  for (const p of [player, player2]) {
    if (!p || !p.alive || p.invincible > 0) continue;
    for (const ex of explosions) {
      if (ex.hasHit) continue;
      if (dist(ex.x, ex.y, p.x, p.y) < ex.radius) {
        ex.hasHit = true; p.hit(); break;
      }
    }
  }

  // 道具拾取（含P2）
  for (const p of [player, player2]) {
    if (!p || !p.alive) continue;
    for (const pu of powerUps) {
      if (!pu.alive) continue;
      if (rectCollide(pu.getRect(), p.getRect())) {
        pu.alive = false; applyPowerUp(pu.type, p);
        spawnExplosion(pu.x, pu.y, 8, POWERUP_COLORS[pu.type]); audio.playPowerUp();
      }
    }
  }
}

/** Boss被击败 */
function onBossDefeated() {
  bossActive = false;
  bossesDefeated++; // V3.3: 每击败Boss计数+1
  audio.playBossExplosion();
  spawnBossExplosion(currentBoss.x, currentBoss.y);
  shakeFrames = 20;

  // V3: 解锁武器
  weaponUnlockName = '';
  const bossNum = currentStage; // 当前关卡Boss编号
  if (bossNum === 1 && !unlockedWeapons.includes('sideCannon')) {
    unlockedWeapons.push('sideCannon');
    weaponUnlockName = 'sideCannon';
  } else if (bossNum === 2 && !unlockedWeapons.includes('plasmaCannon')) {
    unlockedWeapons.push('plasmaCannon');
    weaponUnlockName = 'plasmaCannon';
  } else if (bossNum === 3 && !unlockedWeapons.includes('emp')) {
    unlockedWeapons.push('emp');
    weaponUnlockName = 'emp';
  } else if (bossNum >= 4) {
    // Boss4+ 武器等级递增
    weaponLevel++;
  }
  if (weaponUnlockName) {
    audio.playWeaponUnlock();
  }

  // V3.6: 战机变形升级（每3个Boss）— 延迟到答题后触发
  pendingTransform = false;
  transformAnnounce = '';
  const newTransformLevel = Math.floor(bossesDefeated / 3);
  if (newTransformLevel > transformLevel) {
    pendingTransform = true; // 标记待变形，答题后触发
    transformLevel = newTransformLevel;
    const transformNames = ['阿尔法形态', '贝塔形态', '伽马形态', '欧米茄形态'];
    transformAnnounce = transformNames[Math.min(transformLevel - 1, transformNames.length - 1)] || '终极形态';
  }

  // V4.2: 雷霆战机激活（每3个Boss触发）
  if (bossesDefeated > 0 && bossesDefeated % 3 === 0) {
    killStreakFlash = 180; // 约3秒满屏闪烁
    // 播放雷霆战机激活语音
    const thunderIdx = 33; // audio/34_thunder_activated.mp3
    const thunderAudio = audio._preloadedAudio[thunderIdx];
    if (thunderAudio && !audio.muted) { try { thunderAudio.currentTime = 0; thunderAudio.play().catch(() => {}); } catch(e) {} }
    // 合成雷霆音效
    if (audio.ctx && !audio.muted) {
      const t = audio.ctx.currentTime;
      const notes = [300, 400, 500, 600, 700, 800, 900, 1000, 1100, 1200];
      for (let i = 0; i < notes.length; i++) {
        const o = audio._createOsc('square', notes[i], 0.08, t + i * 0.05, 0);
        if (o) { o.gain.gain.setValueAtTime(0.08, t + i * 0.05); o.gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.05 + 0.12); o.osc.start(t + i * 0.05); o.osc.stop(t + i * 0.05 + 0.12); }
      }
    }
  }

  // V3.3: 新敌机解锁提示
  newEnemyUnlockName = '';
  const enemyUnlocks = {
    1: '分裂机', 2: '俯冲机', 3: '护盾机', 4: '蜂群机', 5: '精英机'
  };
  if (enemyUnlocks[bossesDefeated]) {
    newEnemyUnlockName = enemyUnlocks[bossesDefeated];
  }

  // 大量道具掉落（含missile和power道具更高概率）
  for (let i = 0; i < 6; i++) {
    const px = currentBoss.x + rand(-60, 60);
    const py = currentBoss.y + rand(-30, 30);
    let type;
    const r = Math.random();
    if (r < 0.25) { type = 'missile'; }
    else if (r < 0.45) { type = 'power'; }
    else { type = POWERUP_TYPES[randInt(0, POWERUP_TYPES.length - 1)]; }
    powerUps.push(new PowerUp(px, py, type));
  }

  // Boss击败奖励分数
  score += Math.floor(currentStage * 5000 * _diffScoreMult);
  gameState = STATE.BOSS_DEFEATED; bossDefeatedTimer = 0;
}

/** V3.6: 生成一道20以内加减法算术题 */
function generateQuiz() {
  quizOp = Math.random() < 0.5 ? '+' : '-';
  if (quizOp === '+') {
    quizA = randInt(0, 19);
    quizB = randInt(0, 20 - quizA);
    quizAnswer = quizA + quizB;
  } else {
    quizA = randInt(1, 20);
    quizB = randInt(0, quizA);
    quizAnswer = quizA - quizB;
  }
  quizInput = '';
  quizResult = 0;
  quizTimer = 0;
  quizWrongCount = 0;
}

function startQuiz() { generateQuiz(); }

/** 答题正确庆祝画面 */

  ctx.save(); ctx.textAlign = 'center';

  ctx.fillText('Congratulations!', 0, 50);
  ctx.fillStyle = '#44ff88'; ctx.font = '20px Courier New';
