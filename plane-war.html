  ctx.restore();
}

/** 算术答题界面 */
function drawQuiz() {
  quizTimer++;
  ctx.save();
  // 半透明遮罩
  ctx.fillStyle = 'rgba(0,0,20,0.7)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';

  if (quizResult === 1) {
    drawQuizCelebration();
    // 庆祝粒子
    if (quizTimer % 3 === 0) {
      spawnExplosion(rand(W * 0.1, W * 0.9), rand(H * 0.1, H * 0.7), 6, '#ffdd00');
    }
    // 庆祝1.5秒后：有变形则进入变形动画，否则直接下一关
    if (quizTimer >= 90) {
      if (pendingTransform) {
        pendingTransform = false;
        gameState = STATE.TRANSFORM;
        transformAnimTimer = 0;
        transformFlash = 180; // 3秒闪光
        player.lives = Math.min(player.lives + 1, CFG.playerMaxLives);
        if (player2 && player2.alive) player2.lives = Math.min(player2.lives + 1, CFG.playerMaxLives);
        audio.playWeaponUnlock(); // 变形音效
      } else {
        enterNextStage();
      }
    }
    ctx.restore(); return;
  }

  // V3.4: 答题3次失败 → Game Over
  if (quizResult === 3) {
    const scale = Math.min(1, quizTimer / 15);
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(scale, scale);
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, 180);
    grad.addColorStop(0, 'rgba(255,50,50,0.3)');
    grad.addColorStop(1, 'rgba(255,50,50,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(-180, -180, 360, 360);
    ctx.shadowColor = '#ff3333'; ctx.shadowBlur = 30;
    ctx.fillStyle = '#ff3333'; ctx.font = 'bold 44px Courier New';
    ctx.fillText('很遗憾，游戏结束', 0, -20);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffaa88'; ctx.font = 'bold 22px Courier New';
    ctx.fillText(`${quizA} ${quizOp} ${quizB} = ${quizAnswer}`, 0, 40);
    ctx.fillStyle = 'rgba(200,180,180,0.6)'; ctx.font = '16px Courier New';
    ctx.fillText('连续3次答错，挑战失败', 0, 80);
    ctx.restore();
    if (quizTimer >= 120) {
      // 转入GAMEOVER
      gameState = STATE.GAMEOVER; gameOverTimer = 0;
      if (score > hiScore) { hiScore = score; localStorage.setItem('planeWarHi', hiScore.toString()); }
    }
    ctx.restore(); return;
  }

  // 题目卡片
  const cardW = 320, cardH = 220;
  const cardX = W / 2 - cardW / 2, cardY = H / 2 - cardH / 2 - 20;
  ctx.fillStyle = 'rgba(10,15,40,0.95)'; ctx.fillRect(cardX, cardY, cardW, cardH);
  ctx.strokeStyle = quizWrongFlash > 0 ? '#ff5050' : '#00ffff'; ctx.lineWidth = 2; ctx.strokeRect(cardX, cardY, cardW, cardH);
  if (quizWrongFlash > 0) quizWrongFlash--;

  // 标题
  ctx.fillStyle = '#00ffff'; ctx.font = 'bold 14px Courier New';
  ctx.fillText('STAGE CLEAR — 20以内答题挑战', W / 2, cardY + 28);

  // 算式
  ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 15;
  ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 48px Courier New';
  ctx.fillText(`${quizA} ${quizOp} ${quizB} = ?`, W / 2, cardY + 85); ctx.shadowBlur = 0;

  // 输入框
  const inputDisplay = quizInput || '_';
  ctx.fillStyle = quizWrongFlash > 0 ? 'rgba(255,80,80,0.15)' : 'rgba(0,255,255,0.1)';
  ctx.fillRect(W / 2 - 80, cardY + 105, 160, 44);
  ctx.strokeStyle = quizWrongFlash > 0 ? '#ff5050' : '#00ffff'; ctx.lineWidth = 1.5; ctx.strokeRect(W / 2 - 80, cardY + 105, 160, 44);
  ctx.fillStyle = quizWrongFlash > 0 ? '#ff5050' : '#ffffff'; ctx.font = 'bold 32px Courier New';
  ctx.fillText(inputDisplay, W / 2, cardY + 138);

  // 提示
  if (quizWrongFlash > 0) {
    ctx.fillStyle = '#ff5050'; ctx.font = 'bold 14px Courier New';
    ctx.fillText(`答错了！再想想～ (×${quizWrongCount})`, W / 2, cardY + 175);
  } else {
    ctx.fillStyle = 'rgba(150,180,200,0.6)'; ctx.font = '12px Courier New';
    ctx.fillText('按数字键输入答案，Enter确认', W / 2, cardY + 175);
  }
  // 剩余次数提示
  if (quizWrongCount > 0) {
    ctx.fillStyle = 'rgba(255,200,100,0.7)'; ctx.font = '11px Courier New';
    ctx.fillText(`还剩 ${3 - quizWrongCount} 次机会`, W / 2, cardY + 200);
  }

  // V3.3: 虚拟数字键盘（支持触屏）
  const kbY = cardY + cardH + 15;
  const btnSize = 40, btnGap = 8;
  const kbCols = 5;
  const kbStartX = W / 2 - (kbCols * (btnSize + btnGap) - btnGap) / 2;
  // 0-9 按钮
  for (let i = 0; i <= 9; i++) {
    const row = Math.floor(i / kbCols), col = i % kbCols;
    const bx = kbStartX + col * (btnSize + btnGap);
    const by = kbY + row * (btnSize + btnGap);
    ctx.fillStyle = 'rgba(0,60,80,0.7)'; ctx.fillRect(bx, by, btnSize, btnSize);
    ctx.strokeStyle = 'rgba(0,255,255,0.4)'; ctx.lineWidth = 1; ctx.strokeRect(bx, by, btnSize, btnSize);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 18px Courier New';
    ctx.fillText(i.toString(), bx + btnSize / 2, by + btnSize / 2 + 6);
  }
  // 退格键
  const bsX = kbStartX + (kbCols - 2) * (btnSize + btnGap);
  const bsY = kbY + 2 * (btnSize + btnGap);
  ctx.fillStyle = 'rgba(80,30,30,0.7)'; ctx.fillRect(bsX, bsY, btnSize, btnSize);
  ctx.strokeStyle = 'rgba(255,100,100,0.4)'; ctx.strokeRect(bsX, bsY, btnSize, btnSize);
  ctx.fillStyle = '#ff8888'; ctx.font = 'bold 12px Courier New';
  ctx.fillText('DEL', bsX + btnSize / 2, bsY + btnSize / 2 + 4);
  // 确认键
  const okX = bsX + btnSize + btnGap;
  ctx.fillStyle = 'rgba(30,80,30,0.7)'; ctx.fillRect(okX, bsY, btnSize, btnSize);
  ctx.strokeStyle = 'rgba(100,255,100,0.4)'; ctx.strokeRect(okX, bsY, btnSize, btnSize);
  ctx.fillStyle = '#88ff88'; ctx.font = 'bold 12px Courier New';
  ctx.fillText('OK', okX + btnSize / 2, bsY + btnSize / 2 + 4);

  ctx.restore();
}

/** V3.3: 答题虚拟键盘点击处理 */
function handleQuizClick(mx, my) {
  const cardW = 320, cardH = 220;
  const cardY = H / 2 - cardH / 2 - 20;
  const kbY = cardY + cardH + 15;
  const btnSize = 40, btnGap = 8;
  const kbCols = 5;
  const kbStartX = W / 2 - (kbCols * (btnSize + btnGap) - btnGap) / 2;

  // 检测0-9按钮
  for (let i = 0; i <= 9; i++) {
    const row = Math.floor(i / kbCols), col = i % kbCols;
    const bx = kbStartX + col * (btnSize + btnGap);
    const by = kbY + row * (btnSize + btnGap);
    if (mx >= bx && mx <= bx + btnSize && my >= by && my <= by + btnSize) {
      if (quizInput.length < 3) { quizInput += i.toString(); shakeFrames = 2; }
      return;
    }
  }
  // 检测退格
  const bsX = kbStartX + (kbCols - 2) * (btnSize + btnGap);
  const bsY = kbY + 2 * (btnSize + btnGap);
  if (mx >= bsX && mx <= bsX + btnSize && my >= bsY && my <= bsY + btnSize) {
    if (quizInput.length > 0) quizInput = quizInput.slice(0, -1);
    return;
  }
  // 检测确认
  const okX = bsX + btnSize + btnGap;
  if (mx >= okX && mx <= okX + btnSize && my >= bsY && my <= bsY + btnSize) {
    if (quizInput.length > 0) {
      if (parseInt(quizInput) === quizAnswer) {
        quizResult = 1; quizTimer = 0;
        audio.playCongraz();
      } else {
        quizWrongCount++; shakeFrames = 12;
        audio.playQuizWrong();
        quizInput = ''; quizResult = 0; quizWrongFlash = 60;
        if (quizWrongCount >= 3) {
          quizResult = 3; quizTimer = 0;
        }
      }
    }
    return;
  }
}

/** 更新答题状态 */
function updateQuiz() {
  quizTimer++;
  if (quizResult === 3 && quizTimer === 1) audio.playGameOver();
  player.update();
  if (player2) player2.update(); // V4
  for (const p of particles) p.update(); particles = particles.filter(p => p.life > 0);
}

/** V3.6: 变形动画专用更新 */
function updateTransform() {
  transformAnimTimer++;
  player.update();
  for (const p of particles) p.update(); particles = particles.filter(p => p.life > 0);
  if (transformFlash > 0) transformFlash--;
  // 变形动画持续180帧（3秒），之后进入下一关
  if (transformAnimTimer >= 180) {
    enterNextStage();
  }
}

/** V3.6: 变形动画专用绘制 */
function drawTransform() {
  const t = transformAnimTimer;
  const total = 180;

  // 背景深蓝黑
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,15,0.85)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';

  // 阶段1: 0-60帧 — 光芒聚集（从战机位置向外扩散光环）
  if (t < 60) {
    const p = t / 60; // 0→1
    // 中心光芒
    const grad = ctx.createRadialGradient(W/2, H*0.45, 0, W/2, H*0.45, 80 + 120*p);
    grad.addColorStop(0, `rgba(0,200,255,${0.6*p})`);
    grad.addColorStop(0.5, `rgba(0,100,255,${0.3*p})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    // 环状能量
    ctx.strokeStyle = `rgba(0,200,255,${0.8*p})`;
    ctx.lineWidth = 2 + p * 3;
    ctx.beginPath();
    ctx.arc(W/2, H*0.45, 30 + 60*p, 0, Math.PI*2);
    ctx.stroke();
    // 旋转光线
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2 + t * 0.08;
      const len = 40 + 80 * p;
      ctx.strokeStyle = `rgba(100,200,255,${0.4*p})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(W/2 + Math.cos(angle)*30, H*0.45 + Math.sin(angle)*30);
      ctx.lineTo(W/2 + Math.cos(angle)*len, H*0.45 + Math.sin(angle)*len);
      ctx.stroke();
    }
  }

  // 阶段2: 60-120帧 — 爆发光芒+变形名称
  if (t >= 60 && t < 120) {
    const p = (t - 60) / 60;
    // 大范围光晕
    const grad = ctx.createRadialGradient(W/2, H*0.45, 0, W/2, H*0.45, 200);
    grad.addColorStop(0, `rgba(255,220,50,${0.5 - 0.3*p})`);
    grad.addColorStop(0.3, `rgba(0,200,255,${0.4 - 0.2*p})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    // 粒子散射
    if (t % 2 === 0) {
      spawnExplosion(W/2 + rand(-50,50), H*0.45 + rand(-50,50), 4, '#00ccff');
    }
    if (t % 3 === 0) {
      spawnExplosion(W/2 + rand(-80,80), H*0.45 + rand(-80,80), 3, '#ffdd00');
    }
  }

  // 阶段3: 120-180帧 — 新形态展示+信息面板
  if (t >= 120) {
    const p = (t - 120) / 60;
    // 柔和光环（新形态已稳定）
    const grad = ctx.createRadialGradient(W/2, H*0.45, 0, W/2, H*0.45, 150);
    grad.addColorStop(0, `rgba(0,200,255,${0.15})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  // 绘制玩家战机（始终可见，带强化特效）
  if (player.alive) player.draw();

  // 变形文字信息（60帧后开始显示）
  if (t >= 60) {
    const textAlpha = Math.min(1, (t - 60) / 30);
    ctx.globalAlpha = textAlpha;

    // 标题：TRANSFORMATION
    const titleScale = t < 90 ? 1 + 0.3 * Math.sin((t-60)/30 * Math.PI) : 1;
    ctx.save();
    ctx.translate(W/2, H * 0.15);
    ctx.scale(titleScale, titleScale);
    ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 25;
    ctx.fillStyle = '#00ffff'; ctx.font = 'bold 28px Courier New';
    ctx.fillText('TRANSFORMATION', 0, 0);
    ctx.shadowBlur = 0;
    ctx.restore();

    // 变形名称
    if (t >= 80) {
      const nameAlpha = Math.min(1, (t - 80) / 20);
      ctx.globalAlpha = nameAlpha;
      const namePulse = 1 + 0.05 * Math.sin(t * 0.15);
      ctx.save();
      ctx.translate(W/2, H * 0.25);
      ctx.scale(namePulse, namePulse);
      ctx.shadowColor = '#ffdd00'; ctx.shadowBlur = 20;
      ctx.fillStyle = '#ffdd00'; ctx.font = 'bold 36px Courier New';
      ctx.fillText(transformAnnounce, 0, 0);
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // 奖励信息（100帧后）
    if (t >= 100) {
      const infoAlpha = Math.min(1, (t - 100) / 20);
      ctx.globalAlpha = infoAlpha;
      const infoY = H * 0.72;
      // 信息面板
      const boxW = 280, boxH = 80;
      const boxX = W/2 - boxW/2, boxY = infoY - boxH/2;
      ctx.fillStyle = 'rgba(0,15,30,0.8)';
      roundRect(ctx, boxX, boxY, boxW, boxH, 8);
      ctx.fill();
      ctx.strokeStyle = '#00ccff'; ctx.lineWidth = 1.5;
      roundRect(ctx, boxX, boxY, boxW, boxH, 8);
      ctx.stroke();
      ctx.fillStyle = '#44ff88'; ctx.font = 'bold 18px Courier New';
      ctx.fillText('❤ 生命+1', W/2, infoY - 15);
      ctx.fillStyle = '#88ccff'; ctx.font = '16px Courier New';
      ctx.fillText('装甲强化 | 火力提升', W/2, infoY + 15);
    }

    ctx.globalAlpha = 1;
  }

  // 全屏闪光（0-30帧）
  if (t < 30) {
    const flashA = (1 - t/30) * 0.5;
    ctx.fillStyle = `rgba(200,230,255,${flashA})`;
    ctx.fillRect(0, 0, W, H);
  }

  // 粒子始终绘制
  for (const p of particles) p.draw();

  ctx.restore();
}

/** 进入下一关 */
function enterNextStage() {
  currentStage++; stageTimer = 0; stageKillCount = 0;
  bossActive = false; currentBoss = null; bossBullets = []; laserWarnings = [];
  enemies = []; missiles = []; bombs = []; explosions = []; plasmaBullets = []; bullets = [];
  gameState = STATE.STAGE_INTRO; stageIntroTimer = 0; stageIntroPhase = 0;
  // V4.2.1: 不再播放playStageStart，避免与庆祝语音重叠
  audio.playPowerUp(); // 改用轻量的道具音效提示新关卡
}

/** 应用道具效果 — V4: 支持P2 */
function applyPowerUp(type, p) {
  const tgt = p || player; // 默认给P1
  switch (type) {
    case 'heal': tgt.lives = Math.min(tgt.lives + 1, CFG.playerMaxLives); break;
    case 'double': tgt.doubleFire = CFG.doubleDuration; break;
    case 'shield': tgt.shield = CFG.shieldDuration; audio.playShield(); break;
    case 'missile': missileAmmo += CFG.missileCount; break;
    case 'power': tgt.bulletLevel = Math.min(tgt.bulletLevel + 1, CFG.bulletLevelMax); break;
    case 'fire': tgt.fireBullets = 600; break; // V4.2.1: 火焰子弹约10秒
    case 'drone': tgt.drones = Math.min((tgt.drones || 0) + 5, 99); audio.playPowerUp(); break; // V4.3: 无人机+5架
  }
}

// V4.3: 无人机释放 — 在(x,y)位置释放无人机，冲击波消灭范围内敌机
function deployDrone(x, y) {
  // 冲击波特效对象
  droneBlasts.push({
    x: x, y: y,
    radius: 0,       // 当前半径
    maxRadius: 200,    // 最大半径
    damage: 5,          // 每架无人机造成5点伤害（3架击杀titan）
    frame: 0,
    alive: true,
  });
  audio.playExplosion();
}

/** 更新无人机冲击波 */
function updateDroneBlasts() {
  for (const b of droneBlasts) {
    if (!b.alive) continue;
    b.frame++;
    b.radius = b.maxRadius * (b.frame / 20); // 20帧扩散完毕
    if (b.frame >= 20) { b.alive = false; continue; }
    // 对范围内敌机造成伤害
    for (const e of enemies) {
      if (!e.alive) continue;
      if (e.type === 'ghost') continue; // V4.4: 幽灵机不受无人机冲击波伤害
      if (dist(b.x, b.y, e.x, e.y) < b.radius + Math.max(e.w, e.h) / 2) {
        e.hp -= b.damage;
        spawnSpark(e.x, e.y);
        if (e.hp <= 0) { onEnemyKilled(e); }
      }
    }
    // 对范围内炸弹造成伤害（提前引爆）
    for (const bomb of bombs) {
      if (!bomb.alive) continue;
      if (dist(b.x, b.y, bomb.x, bomb.y) < b.radius + 15) {
        bomb.alive = false;
        spawnExplosion(bomb.x, bomb.y, 10, '#ff8800');
      }
    }
  }
  // 清理已结束的冲击波
  for (let i = droneBlasts.length - 1; i >= 0; i--) {
    if (!droneBlasts[i].alive) droneBlasts.splice(i, 1);
  }
}

/** 绘制无人机冲击波 */
function drawDroneBlasts() {
  for (const b of droneBlasts) {
    if (!b.alive) continue;
    const progress = b.frame / 20;
    const alpha = 0.5 * (1 - progress);
    // 外圈冲击波
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(0,255,136,${alpha})`;
    ctx.lineWidth = 3 * (1 - progress);
    ctx.stroke();
    // 内圈填充
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius * 0.6, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0,255,136,${alpha * 0.2})`;
    ctx.fill();
    // 中心无人机图标（小三角）
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#00ff88';
    ctx.beginPath();
    ctx.moveTo(0, -8); ctx.lineTo(-6, 6); ctx.lineTo(6, 6);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

// ==================== 绘制主循环 ====================

function drawGame() {
  ctx.fillStyle = '#06061a'; ctx.fillRect(0, 0, W, H);
  starField.draw();

  // V4.2: 雷霆战机满屏闪烁特效（每3 Boss触发一次）
  if (killStreakFlash > 0) {
    killStreakFlash--;
    const flashIntensity = killStreakFlash / 180; // 1→0
    const flashColor = killStreakFlash % 8 < 4 ? 'rgba(255,255,0,' : 'rgba(0,255,255,';
    // 背景闪烁
    ctx.fillStyle = flashColor + (flashIntensity * 0.15) + ')';
    ctx.fillRect(0, 0, W, H);
    // 满屏战机线条闪烁（横向飞过的虚线）
    const lineCount = 8;
    for (let i = 0; i < lineCount; i++) {
      const x = (i / lineCount) * W + ((killStreakFlash * 8 + i * 37) % W);
      const alpha = flashIntensity * 0.4 * Math.sin(i * 1.7);
      ctx.strokeStyle = `rgba(255,255,100,${alpha})`;
      ctx.lineWidth = 2;
      ctx.setLineDash([20, 15]);
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 40, H); ctx.stroke();
    }
    ctx.setLineDash([]);
    // 中心文字
    if (killStreakFlash > 100) {
      const scale = (killStreakFlash - 100) / 80;
      ctx.save();
      ctx.globalAlpha = scale;
      ctx.fillStyle = '#ffff00';
      ctx.font = `bold ${Math.floor(28 * (1 + (80 - killStreakFlash + 100) * 0.01))}px Courier New`;
      ctx.textAlign = 'center';
      ctx.fillText('⚡ 雷霆战机激活！', W / 2, H / 2 - 20);
      ctx.font = 'bold 16px Courier New';
      ctx.fillStyle = '#00ffff';
      ctx.fillText('每3击杀触发 · 全屏火力覆盖！', W / 2, H / 2 + 15);
      ctx.restore();
    }
  }

  if (shakeFrames > 0) {
    const intensity = shakeFrames * 0.6;
    ctx.save(); ctx.translate(rand(-intensity, intensity), rand(-intensity, intensity));
  }

  const playingStates = [STATE.PLAYING, STATE.BOSS_FIGHT, STATE.BOSS_WARNING, STATE.BOSS_DEFEATED, STATE.STAGE_INTRO];
  if (playingStates.includes(gameState) || gameState === STATE.GAMEOVER) {
    // 道具
    for (const p of powerUps) p.draw();
    // 敌机
    for (const e of enemies) e.draw();
    // Boss
    if (currentBoss && currentBoss.alive) currentBoss.draw();
    // Boss激光预警
    for (const l of laserWarnings) l.draw();
    // V3: 炸弹
    for (const b of bombs) b.draw();
    // 子弹
    for (const b of bullets) b.draw();
    // V3: 等离子弹
    for (const p of plasmaBullets) p.draw();
    // V3: 导弹
    for (const m of missiles) m.draw();
    // Boss追踪弹
    for (const b of bossBullets) b.draw();
    // 玩家
    if (player.alive) player.draw();
    if (player2 && player2.alive) player2.draw(); // V4: 绘制P2
    // 粒子
    for (const p of particles) p.draw();
    // V4.3: 无人机冲击波绘制
    drawDroneBlasts();
    // V3: 绘制爆炸圈
    for (const ex of explosions) {
      const t = ex.timer / ex.maxTimer;
      ctx.save();
      ctx.globalAlpha = t * 0.6;
      ctx.strokeStyle = '#ff6600'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = `rgba(255,100,0,${t * 0.15})`;
      ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // V3: 绘制EMP波纹
    if (empActive && empWaveRadius > 0) {
      ctx.save();
      ctx.globalAlpha = (empTimer / CFG.empStunDuration) * 0.5;
      ctx.strokeStyle = '#4488ff'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(player.x, player.y, empWaveRadius, 0, Math.PI * 2); ctx.stroke();
      // 内圈
      ctx.strokeStyle = 'rgba(100,180,255,0.3)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(player.x, player.y, empWaveRadius * 0.7, 0, Math.PI * 2); ctx.stroke();
      // 外圈
      ctx.strokeStyle = 'rgba(68,136,255,0.2)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(player.x, player.y, empWaveRadius * 1.2, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    // HUD
    drawHUD();
  }

  if (shakeFrames > 0) ctx.restore();

  // 叠加界面
  if (gameState === STATE.MENU) drawMenu();
  else if (gameState === STATE.GAMEOVER) drawGameOver();
  else if (gameState === STATE.STAGE_INTRO) drawStageIntro();
  else if (gameState === STATE.BOSS_WARNING) drawBossWarning();
  else if (gameState === STATE.BOSS_DEFEATED) drawBossDefeated();
  else if (gameState === STATE.QUIZ) drawQuiz();
  else if (gameState === STATE.TRANSFORM) drawTransform();

  // V3.6: 庆祝语音气泡（无论何种游戏状态都显示）
  if (celebrationToastTimer > 0) {
    celebrationToastTimer--;
    const toastAlpha = celebrationToastTimer > 90 ? 1 : celebrationToastTimer / 90;
    const toastY = 90;
    ctx.save();
    ctx.globalAlpha = toastAlpha;
    ctx.textAlign = 'center';
    // 背景气泡
    const tw = ctx.measureText(celebrationToast).width || 200;
    const bw = tw + 40, bh = 42, bx = W / 2 - bw / 2, by = toastY - bh / 2;
    ctx.fillStyle = 'rgba(255,200,0,0.9)';
    roundRect(ctx, bx, by, bw, bh, 10);
    ctx.fill();
    ctx.strokeStyle = '#ff8800';
    ctx.lineWidth = 2;
    roundRect(ctx, bx, by, bw, bh, 10);
    ctx.stroke();
    // 文字
    ctx.fillStyle = '#1a0800';
    ctx.font = 'bold 18px Courier New';
    ctx.fillText(celebrationToast, W / 2, toastY + 6);
    ctx.restore();
  }
}

// V3.6: 圆角矩形辅助函数
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ==================== 主循环 ====================

function gameLoop() {
  starField.update();

  if (gameState === STATE.PLAYING) {
    updateGame();
  } else if (gameState === STATE.BOSS_FIGHT) {
    updateBossFight();
  } else if (gameState === STATE.BOSS_WARNING) {
    updateBossWarning();
  } else if (gameState === STATE.BOSS_DEFEATED) {
    updateBossDefeated();
  } else if (gameState === STATE.STAGE_INTRO) {
    updateStageIntro();
  } else if (gameState === STATE.QUIZ) {
    updateQuiz();
  } else if (gameState === STATE.TRANSFORM) {
    updateTransform();
  } else if (gameState === STATE.MENU) {
    if (clickHandled) { clickHandled = false; audio.init(); resetGame(); }
  } else if (gameState === STATE.GAMEOVER) {
    for (const p of particles) p.update(); particles = particles.filter(p => p.life > 0);
    for (const e of enemies) e.update(); enemies = enemies.filter(e => e.alive);
    for (const b of bullets) b.update(); bullets = bullets.filter(b => b.alive);
    for (const b of bossBullets) b.update(); bossBullets = bossBullets.filter(b => b.alive);
    for (const l of laserWarnings) l.update(); laserWarnings = laserWarnings.filter(l => !l.done);
    for (const p of powerUps) p.update(); powerUps = powerUps.filter(p => p.alive);
    for (const m of missiles) m.update(); missiles = missiles.filter(m => m.alive);
    for (const b of bombs) b.update(); bombs = bombs.filter(b => b.alive);
    for (const p of plasmaBullets) p.update(); plasmaBullets = plasmaBullets.filter(p => p.alive);
    if (clickHandled && gameOverTimer > 0.5) { clickHandled = false; audio.init(); resetGame(); }
  }

  drawGame();
  requestAnimationFrame(gameLoop);
}

// ---- 关卡状态更新函数 ----

function updateStageIntro() {
  stageIntroTimer++;
  player.update();
  if (player2) player2.update(); // V4
  for (const p of particles) p.update(); particles = particles.filter(p => p.life > 0);
  if (stageIntroTimer >= CFG.stageIntroFrames) gameState = STATE.PLAYING;
}

function updateBossWarning() {
  bossWarningTimer++;
  player.update();
  if (player2) player2.update(); // V4
  for (const p of particles) p.update(); particles = particles.filter(p => p.life > 0);
  for (const e of enemies) e.update(); enemies = enemies.filter(e => e.alive);
  for (const b of bullets) b.update(); bullets = bullets.filter(b => b.alive);
  if (bossWarningTimer >= CFG.bossWarningFrames) {
    currentBoss = new Boss(currentStage); bossActive = true;
    bossBullets = []; laserWarnings = [];
    gameState = STATE.BOSS_FIGHT; stageTimer = 0;
  }
}

function updateBossFight() {
  frameCount++; difficulty = frameCount * 0.001;
  if (comboTimer > 0) { comboTimer--; if (comboTimer <= 0) combo = 0; }
  if (shakeFrames > 0) shakeFrames--;
  if (currentBoss) currentBoss.update();
  updateEntities();
}

function updateBossDefeated() {
  bossDefeatedTimer++;
  player.update();
  if (player2) player2.update(); // V4
  for (const p of particles) p.update(); particles = particles.filter(p => p.life > 0);
  for (const p of powerUps) p.update(); powerUps = powerUps.filter(p => p.alive);
  // V4: 两个玩家都能拾取道具
  for (const pl of [player, player2]) {
    if (!pl || !pl.alive) continue;
    for (const p of powerUps) {
      if (!p.alive) continue;
      if (rectCollide(p.getRect(), pl.getRect())) {
        p.alive = false; applyPowerUp(p.type, pl);
        spawnExplosion(p.x, p.y, 8, POWERUP_COLORS[p.type]); audio.playPowerUp();
      }
    }
  }
  if (bossDefeatedTimer % 8 === 0 && bossDefeatedTimer < 120) {
    spawnExplosion(rand(W * 0.2, W * 0.8), rand(H * 0.2, H * 0.5), 8, '#ffcc00');
  }
  if (bossDefeatedTimer >= 240) {
    startQuiz();
    gameState = STATE.QUIZ;
  }
}

// 启动！
gameLoop();

</script>
